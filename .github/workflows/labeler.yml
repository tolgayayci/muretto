name: labeler

# Labels pull requests by the paths they change (.github/labeler.yml).
# pull_request_target runs in the base repository's context so it can label
# pull requests from forks. It is safe here only because this workflow never
# checks out or runs pull request code: the labeler reads the changed file
# list and the base branch's .github/labeler.yml through the API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
