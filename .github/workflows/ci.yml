name: ci

on:
  pull_request:          # fork PRs get a read-only GITHUB_TOKEN and no secrets; never use pull_request_target
  push:
    branches: [main]

permissions:
  contents: read         # least privilege; jobs never need more

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.3"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Which parts of the repo a pull request touches. Jobs below are gated on
  # these outputs instead of workflow-level `paths:`, so a required check that
  # does not apply is reported as skipped (which passes) instead of hanging.
  # Pushes to main skip this job and run everything.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists the PR's files through the API (no checkout needed)
    outputs:
      go: ${{ steps.filter.outputs.go }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      site: ${{ steps.filter.outputs.site }}
      docs: ${{ steps.filter.outputs.docs }}
      server-image: ${{ steps.filter.outputs.server-image }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'schema/**'
              - 'adapters/**'
              - 'tools/**'
              - 'Makefile'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'apps/dashboard/**'
              - 'schema/**'
              - '.github/workflows/ci.yml'
            site:
              - 'apps/site/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'apps/docs/**'
              - '.github/workflows/ci.yml'
            server-image:
              - 'server/**'
              - 'internal/contract/**'
              - 'schema/**'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'

  go:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - name: generated Go code is up to date
        run: |
          go tool -modfile=tools/go.mod go-jsonschema --only-models -t --capitalization ID --tags json \
            -p contract -o internal/contract/zz_generated.go schema/*.schema.json
          git diff --exit-code -- internal/contract
      - name: vet
        run: go vet ./...
      - name: test (no network, no accounts)
        run: go test -race -count=1 ./...
      - name: build without cgo for all release targets
        run: |
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/muretto
          done
      - name: govulncheck (pinned in tools/go.mod)
        run: go tool -modfile=tools/go.mod govulncheck ./...

  golangci:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  adapters:
    # Also covered by `go test ./...` in the go job; run on its own so an
    # adapter PR gets one readable, per-adapter result.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: adapter gate
        run: go test ./adapters/ -v -count=1

  secrets:                 # runs on every PR and push, whatever changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0               # scan full history, not just the tip
          persist-credentials: false
      - name: install gitleaks v8.30.1 (checksum-pinned, no license key needed)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: gitleaks (full history)
        run: /tmp/gitleaks git --redact --no-banner --verbose .
      - name: gitleaks (working tree)
        run: /tmp/gitleaks dir --redact --no-banner --verbose .

  dashboard:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.dashboard == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci --ignore-scripts
      - name: generated TS contract is up to date
        run: npm run generate && git diff --exit-code -- src/contract
      - run: npm run lint
      - run: npx --no-install tsc --noEmit
      - run: npm test
      - run: npm run build

  dashboard-image:
    # The image Railway builds for app.muretto.ai (context apps/dashboard).
    # NEXT_PUBLIC_* are inlined at build time; dummy values are enough to build.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.dashboard == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker build (no push)
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_dummy \
            -t muretto-dashboard:ci apps/dashboard

  server-image:
    # The image Railway builds for api.muretto.ai, from the repository root.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.server-image == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docker build (no push)
        run: docker build -f server/Dockerfile -t murettod:ci .

  site:
    # muretto.ai Worker: bundle and validate the config without deploying.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.site == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci --ignore-scripts
      - name: wrangler deploy --dry-run (no secrets, nothing deployed)
        run: npx --no-install wrangler deploy --dry-run --outdir dist

  docs:
    # Mintlify: internal links, anchors, snippet imports and docs.json redirects.
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.docs == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: mint broken-links (mint CLI pinned)
        run: npx --yes mint@4.2.1063 broken-links --check-anchors --check-snippets --check-redirects
