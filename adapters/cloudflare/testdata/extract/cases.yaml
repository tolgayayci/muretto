# ---- Cloudflare MCP ----
- name: MCP execute that creates a D1 database and returns response.result
  tool: mcp__cloudflare__execute
  input:
    code: |
      async () => {
        const response = await cloudflare.request({
          method: "POST",
          path: `/accounts/${accountId}/d1/database`,
          body: { name: "example-db" },
        });
        return response.result;
      }
  output: '{"uuid":"01234567-89ab-4def-8123-456789abcdef","name":"example-db","created_at":"2026-10-31T09:00:00.000Z","version":"production"}'
  expect:
    - { kind: cloudflare.d1_database, value: 01234567-89ab-4def-8123-456789abcdef, role: created }
  matches: [cloudflare.d1_database:01234567-89ab-4def-8123-456789abcdef]

- name: MCP execute that only lists D1 databases is read-only
  tool: mcp__claude_ai_Cloudflare__execute
  input:
    code: |
      async () => {
        const r = await cloudflare.request({ method: "GET", path: `/accounts/${accountId}/d1/database` });
        return r.result.map((d) => d.name);
      }
  output: '["example-db"]'
  expect: []

- name: MCP execute that creates a KV namespace
  tool: mcp__cloudflare__execute
  input:
    code: |
      async () => {
        const r = await cloudflare.request({ method: "POST", path: `/accounts/${accountId}/storage/kv/namespaces`, body: { title: "example-cache" } });
        return r;
      }
  output: '{"success":true,"errors":[],"messages":[],"result":{"id":"0123456789abcdef0123456789abcd30","title":"example-cache","supports_url_encoding":true}}'
  expect:
    - { kind: cloudflare.kv_namespace, value: 0123456789abcdef0123456789abcd30, role: created }
  matches: [cloudflare.kv_namespace:0123456789abcdef0123456789abcd30]

- name: MCP endpoint tool post_d1_database (codemode=false)
  tool: mcp__cloudflare__post_d1_database
  input: { account_id: 0123456789abcdef0123456789abcdef, name: example-db }
  output: '{"result":{"uuid":"01234567-89ab-4def-8123-456789abcdef","name":"example-db","created_at":"2026-10-31T09:00:00.000Z"},"success":true,"errors":[],"messages":[]}'
  expect:
    - { kind: cloudflare.d1_database, value: 01234567-89ab-4def-8123-456789abcdef, role: created }
  matches: [cloudflare.d1_database:01234567-89ab-4def-8123-456789abcdef]

- name: MCP read of a database references it
  tool: mcp__cloudflare__get_d1_database
  input: { account_id: 0123456789abcdef0123456789abcdef, database_id: 01234567-89ab-4def-8123-456789abcdef }
  output: '{"result":{"uuid":"01234567-89ab-4def-8123-456789abcdef","name":"example-db"},"success":true,"errors":[],"messages":[]}'
  expect:
    - { kind: cloudflare.d1_database, value: 01234567-89ab-4def-8123-456789abcdef, role: referenced }

