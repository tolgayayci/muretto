# ---- curl against the API ----
- name: curl create D1 database
  tool: Bash
  input: { command: "curl -s -X POST https://api.cloudflare.com/client/v4/accounts/0123456789abcdef0123456789abcdef/d1/database -H \"Authorization: Bearer [REDACTED]\" --json '{\"name\":\"example-db\"}'" }
  output: '{"result":{"uuid":"01234567-89ab-4def-8123-456789abcdef","name":"example-db","created_at":"2026-10-31T09:00:00.000Z","version":"production"},"success":true,"errors":[],"messages":[]}'
  expect:
    - { kind: cloudflare.d1_database, value: 01234567-89ab-4def-8123-456789abcdef, role: created }
  matches: [cloudflare.d1_database:01234567-89ab-4def-8123-456789abcdef]

- name: curl create D1 database that failed proves nothing
  tool: Bash
  input: { command: "curl -s -X POST https://api.cloudflare.com/client/v4/accounts/0123456789abcdef0123456789abcdef/d1/database -H \"Authorization: Bearer [REDACTED]\" --json '{\"name\":\"example-db\"}'" }
  output: '{"result":null,"success":false,"errors":[{"code":7502,"message":"A database with that name already exists"}],"messages":[]}'
  expect: []

- name: curl list D1 databases is read-only
  tool: Bash
  input: { command: "curl -s https://api.cloudflare.com/client/v4/accounts/0123456789abcdef0123456789abcdef/d1/database -H \"Authorization: Bearer [REDACTED]\"" }
  output: '{"result":[{"uuid":"01234567-89ab-4def-8123-456789abcdef","name":"example-db"}],"success":true,"errors":[],"messages":[]}'
  expect: []

