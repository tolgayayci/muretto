# Extract cases built from the output strings in adapters/cloudflare/research.md
# (Wrangler source at workers-sdk 3f14c76, cloudflared 872b241, Cloudflare
# MCP README at cloudflare/mcp 4938f2f, API create responses from the OpenAPI
# spec). All ids are fakes and match the scan/basic fixtures.

# ---- Wrangler ----
- name: wrangler d1 create (TOML config, snippet printed)
  tool: Bash
  input: { command: "npx wrangler d1 create example-db" }
  output: |
    ✅ Successfully created DB 'example-db' in region WEUR
    Created your new D1 database.

    To access your new D1 Database in your Worker, add the following snippet to your configuration file:
    [[d1_databases]]
    binding = "example_db"
    database_name = "example-db"
    database_id = "01234567-89ab-4def-8123-456789abcdef"
  expect:
    - { kind: cloudflare.d1_database, value: 01234567-89ab-4def-8123-456789abcdef, role: created }
  matches: [cloudflare.d1_database:01234567-89ab-4def-8123-456789abcdef]

- name: wrangler d1 create (JSON config)
  tool: Bash
  input: { command: "wrangler d1 create example-db --binding DB" }
  output: |
    ✅ Successfully created DB 'example-db'
    Created your new D1 database.

    To access your new D1 Database in your Worker, add the following snippet to your configuration file:
    {
      "d1_databases": [
        {
          "binding": "DB",
          "database_name": "example-db",
          "database_id": "01234567-89ab-4def-8123-456789abcdef"
        }
      ]
    }
  expect:
    - { kind: cloudflare.d1_database, value: 01234567-89ab-4def-8123-456789abcdef, role: created }

- name: wrangler d1 create that failed proves nothing
  tool: Bash
  status: error
  input: { command: "wrangler d1 create example-db" }
  output: "✘ [ERROR] A request to the Cloudflare API failed. A database with that name already exists [code: 7502]"
  expect: []

- name: wrangler kv namespace create
  tool: Bash
  input: { command: "wrangler kv namespace create example-cache" }
  output: |
    Resource location: remote
    🌀 Creating namespace with title "example-cache"
    ✨ Success!
    To access your new KV Namespace in your Worker, add the following snippet to your configuration file:
    {
      "kv_namespaces": [
        {
          "binding": "example_cache",
          "id": "0123456789abcdef0123456789abcd30"
        }
      ]
    }
  expect:
    - { kind: cloudflare.kv_namespace, value: 0123456789abcdef0123456789abcd30, role: created }
  matches: [cloudflare.kv_namespace:0123456789abcdef0123456789abcd30]

- name: wrangler kv namespace list is read-only
  tool: Bash
  input: { command: "wrangler kv namespace list" }
  output: '[{"id": "0123456789abcdef0123456789abcd30", "title": "example-cache", "supports_url_encoding": true}]'
  expect: []

- name: wrangler r2 bucket create
  tool: Bash
  input: { command: "wrangler r2 bucket create example-assets" }
  output: |
    Creating bucket 'example-assets'...
    ✅ Created bucket 'example-assets' with default storage class of Standard.
    To access your new R2 Bucket in your Worker, add the following snippet to your configuration file:
    [[r2_buckets]]
    bucket_name = "example-assets"
    binding = "example_assets"
  expect:
    - { kind: cloudflare.r2_bucket, value: example-assets, role: created }
  matches: [cloudflare.r2_bucket:0123456789abcdef0123456789abcdef/example-assets]

- name: wrangler r2 bucket create in a jurisdiction (not listed, so no id)
  tool: Bash
  input: { command: "wrangler r2 bucket create example-eu --jurisdiction eu" }
  output: |
    Creating bucket 'example-eu (eu)'...
    ✅ Created bucket 'example-eu (eu)' with default storage class of Standard.
  expect: []

- name: wrangler r2 bucket dev-url enable references the bucket
  tool: Bash
  input: { command: "wrangler r2 bucket dev-url enable example-assets --force" }
  output: |
    Enabling public access for bucket 'example-assets'...
    ✨ Public access enabled at 'https://pub-0123456789abcdef0123456789abcd01.r2.dev'.
  expect:
    - { kind: cloudflare.r2_bucket, value: example-assets, role: referenced }

- name: wrangler r2 bucket domain add
  tool: Bash
  input: { command: "wrangler r2 bucket domain add example-assets --domain assets.example.com --zone-id 0123456789abcdef0123456789abcd10 --force" }
  output: |
    Connecting custom domain 'assets.example.com' to bucket 'example-assets'...
    ✨ Custom domain 'assets.example.com' connected successfully.
  expect:
    - { kind: cloudflare.r2_custom_domain, value: example-assets/assets.example.com, role: created }
  matches: [cloudflare.r2_custom_domain:example-assets/assets.example.com]

