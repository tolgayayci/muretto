- name: wrangler pages project create
  tool: Bash
  input: { command: "wrangler pages project create example-site --production-branch main" }
  output: "✨ Successfully created the 'example-site' project. It will be available at https://example-site.pages.dev/ once you create your first deployment."
  expect:
    - { kind: cloudflare.pages_project, value: example-site, role: created }
  matches: [cloudflare.pages_project:0123abcd-0000-4000-8000-0000000000aa]

- name: wrangler pages deploy (creates the project on first run)
  tool: Bash
  input: { command: "wrangler pages deploy dist --project-name example-site --branch feature-x" }
  output: |
    ✨ Successfully created the 'example-site' project.
    ✨ Success! Uploaded 12 files (1.23 sec)

    🌎 Deploying...
    ✨ Deployment complete! Take a peek over at https://0123abcd.example-site.pages.dev
    ✨ Deployment alias URL: https://feature-x.example-site.pages.dev
  expect:
    - { kind: cloudflare.pages_project, value: example-site, role: created }
    - { kind: cloudflare.pages_deployment, value: "https://0123abcd.example-site.pages.dev", role: created }
  matches: [cloudflare.pages_project:0123abcd-0000-4000-8000-0000000000aa, cloudflare.pages_deployment:0123abcd-0000-4000-8000-000000000001]

