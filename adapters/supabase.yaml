# Supabase adapter. Every endpoint, field and output string here comes from
# docs/research/supabase.md (checked 2026-10-26). Format: docs/WRITING_AN_ADAPTER.md.
format: 1
provider: supabase
display_name: Supabase

api:
  base_url: https://api.supabase.com
  auth: { header: Authorization, scheme: Bearer }

# MCP server names this provider answers to. Matching is case-insensitive and
# also accepts claude.ai connectors (mcp__claude_ai_Supabase__x) and plugin
# servers (mcp__plugin_<p>_supabase__x).
mcp_servers: [supabase]

token_help: |
  Create a scoped personal access token in the Supabase dashboard:
  Account > Access tokens > Generate new token, scoped to your organization(s).
  Give it Read access only, to: Projects, Organizations, Organization Projects,
  Project Settings, Development Branches, Production Branches, Edge Functions,
  Storage and Advisors.
  Do not grant Database, Data API JWT Secret, API Key Secrets, Edge Function
  Secrets, Auth Config, or any Read-write permission.
  A legacy (full-access) token also works but can change everything; Muretto
  only ever reads, enforced in code, but a scoped token is safer.

options:
  - name: catalog_rls
    description: >-
      Also list every table and its RLS state with one fixed, read-only catalog
      query (POST /v1/projects/{ref}/database/query/read-only). Needs the
      "Database (Read)" and "Data API Config (Read)" permissions. Warning:
      Database (Read) can read every row of every table. Off by default.

# The broker allowlist is built from exactly these endpoints. Query names not
# listed here are refused. Never add: /v1/branches/{id}, /functions/{slug}/body,
# /config/auth, /secrets, /api-keys, /v2/projects/{ref}/config (the broker
# denies them in Go anyway).
endpoints:
  organizations:
    path: /v1/organizations
  projects:
    path: /v1/projects
    strip: ["[].database.host"]
  branches:
    path: /v1/projects/{ref}/branches
    params: { ref: "{parent.ref}" }
    on_status: { 422: empty } # branching disabled: zero branches
  functions:
    path: /v1/projects/{ref}/functions
    params: { ref: "{parent.ref}" }
  buckets:
    path: /v1/projects/{ref}/storage/buckets
    params: { ref: "{parent.ref}" }
  advisors_security:
    path: /v1/projects/{ref}/advisors/security
    params: { ref: "{parent.ref}" }
    query: { lint_type: sql }
  postgrest:
    path: /v1/projects/{ref}/postgrest
    params: { ref: "{ref}" }
    strip: [jwt_secret]
  rls_catalog:
    method: POST
    path: /v1/projects/{ref}/database/query/read-only
    params: { ref: "{parent.ref}" }
    pinned_body: supabase_rls_catalog_v1 # declared in internal/broker/pinned.go

accounts:
  endpoint: organizations
  items: $
  id: "{slug}"
  name: "{name}"
  slug: "{slug}"

# Stamped on every resource as attributes.account_slug (the account id is the
# org slug here).
account_slug: "{account}"

kinds:
  - kind: project
    sources:
      - endpoint: projects
        items: $
        where: { field: organization_slug, in_field: account }
        id: "{ref}"
        name: "{name}"
        status: "{status|lower}"
        url: "https://supabase.com/dashboard/project/{ref}"
        created_at: { value: "{created_at}", format: rfc3339 }
        attributes:
          - region
          - organization_slug
          - { name: postgres_engine, field: database.postgres_engine }
    enrich:
      - endpoint: postgrest
        requires_option: catalog_rls
        attributes:
          - db_schema # comma-separated exposed schemas
    match: { value: "{provider_id}" }
    remove:
      kind: steps
      text: |
        Delete the project in the Supabase dashboard (Project Settings > General),
        or call the Management API: DELETE https://api.supabase.com/v1/projects/{provider_id}
      note: Deleting a project deletes its database, storage and functions.

  - kind: branch
    for_each: project
    sources:
      - endpoint: branches
        items: $
        # The default branch is the project itself, already listed as a project.
        where: { not: { all: [{ field: is_default, present: true }, { field: is_default, equals: "true" }] } }
        id: "{project_ref}"
        name: "{name}"
        status: "{preview_project_status|or:status|lower}"
        created_at: { value: "{created_at}", format: rfc3339 }
        attributes:
          - parent_project_ref
          - git_branch
          - persistent
          - with_data
    remove:
      kind: command
      text: "supabase branches delete {provider_id}"
      note: Branches are billed per hour while they exist.

  - kind: function
    for_each: project
    sources:
      - endpoint: functions
        items: $
        id: "{parent.ref}/{slug}"
        name: "{slug}"
        status: "{status|lower}"
        url: "https://supabase.com/dashboard/project/{parent.ref}/functions"
        created_at: { value: "{created_at}", format: auto } # int64; unit unverified (ms assumed)
        attributes:
          - slug
          - version
          - verify_jwt
          - { name: project_ref, template: "{parent.ref}" }
    match: { value: "{slug}", container: "{project_ref}" }
    remove:
      kind: command
      text: "supabase functions delete {slug} --project-ref {project_ref}"

  - kind: bucket
    for_each: project
    sources:
      - endpoint: buckets
        items: $
        checks_rules: [public_bucket]
        id: "{parent.ref}/{id}"
        name: "{name}"
        created_at: { value: "{created_at}", format: rfc3339 }
        attributes:
          - public
          - { name: bucket_id, field: id }
          - { name: project_ref, template: "{parent.ref}" }
    match: { value: "{bucket_id}", container: "{project_ref}" }
    remove:
      kind: steps
      text: |
        There is no Management API or CLI command to delete a bucket. Empty and
        delete it in the dashboard (Storage), or with supabase-js and a secret key:
          await supabase.storage.emptyBucket('{bucket_id|sql_literal}')
          await supabase.storage.deleteBucket('{bucket_id|sql_literal}')

  - kind: table
    for_each: project
    sources:
      # Default: the official security advisor. Lists only flagged tables.
      - endpoint: advisors_security
        items: lints
        seen_via: advisor
        where: { field: name, equals: rls_disabled_in_public }
        unavailable_if:
          field: name
          in: [advisor_check_unavailable, db_not_reachable, project_not_active]
        checks_rules: [rls_disabled]
        id: "{parent.ref}/{metadata.schema}.{metadata.name}"
        name: "{metadata.schema}.{metadata.name}"
        attributes:
          - { name: schema, field: metadata.schema }
          - { name: table, field: metadata.name }
          - { name: project_ref, template: "{parent.ref}" }
          - { name: advisor_lint, field: name }
      # Opt-in: every table, from the constant catalog query.
      - endpoint: rls_catalog
        items: $
        requires_option: catalog_rls
        checks_rules: [rls_disabled]
        id: "{parent.ref}/{schema}.{name}"
        name: "{schema}.{name}"
        attributes:
          - schema
          - { name: table, field: name }
          - { name: project_ref, template: "{parent.ref}" }
          - rls_enabled
          - anon_select
          - authenticated_select
    match: { value: "{schema}.{table}", container: "{project_ref}" }
    remove:
      kind: sql
      text: 'drop table if exists "{schema|sql_ident}"."{table|sql_ident}";'
      note: This deletes the table and all its rows. Back it up first if unsure.

rules:
  - id: rls_disabled
    kind: table
    severity: critical
    signal: official_advisor
    applies: { field: advisor_lint, present: true }
    exposed: { field: advisor_lint, equals: rls_disabled_in_public }
    title: "RLS off: {schema}.{table} is publicly readable"
    explanation: >-
      Supabase's security advisor (rls_disabled_in_public) reports that table
      {schema}.{table} is in a schema exposed by the Data API, grants access to
      the anon or authenticated role, and has row level security disabled.
      Anyone with the project's public (publishable or anon) key can read it.
    fix: &rls_fix
      kind: sql
      text: 'ALTER TABLE "{schema|sql_ident}"."{table|sql_ident}" ENABLE ROW LEVEL SECURITY;'
      note: >-
        Enabling RLS without policies blocks all access through the Data API.
        Add policies for the access you want (CREATE POLICY ...). If the table
        should not be reachable at all, also run
        REVOKE SELECT ON "{schema|sql_ident}"."{table|sql_ident}" FROM anon, authenticated;
      docs_url: https://supabase.com/docs/guides/database/database-linter?lint=0013_rls_disabled_in_public

  - id: rls_disabled
    kind: table
    severity: critical
    signal: catalog_query
    applies: { field: rls_enabled, present: true }
    exposed:
      all:
        - { field: rls_enabled, equals: "false" }
        - any:
            - { field: anon_select, equals: "true" }
            - { field: authenticated_select, equals: "true" }
        - { field: schema, in_field: parent.db_schema }
    title: "RLS off: {schema}.{table} is publicly readable"
    explanation: >-
      The read-only catalog query shows table {schema}.{table} has row level
      security disabled, is selectable by anon or authenticated, and its schema
      is exposed by the Data API. Anyone with the public key can read it.
    fix: *rls_fix

  - id: public_bucket
    kind: bucket
    severity: high
    signal: api_field
    exposed: { field: public, equals: "true" }
    title: "Public bucket: {bucket_id}"
    explanation: >-
      Storage bucket {bucket_id} is public: anyone who knows or guesses an
      object path can download its files without a key.
    fix:
      kind: steps
      text: |
        Make the bucket private:
          Dashboard: Storage > {bucket_id} > Edit bucket > turn off "Public bucket" > Save.
          Or SQL (SQL editor): update storage.buckets set public = false where id = '{bucket_id|sql_literal}';
      note: >-
        Public URLs stop working once the bucket is private; serve files with
        signed URLs or storage policies instead.

signatures:
  # ---- Supabase CLI (Bash). Output strings from supabase/cli v2.122.0. ----
  - id: supabase.cli.projects_create
    kind: project
    role: created
    when: { tool: ^Bash$, command: ['\bsupabase\s+projects\s+create\b'] }
    extract:
      - from: output
        pattern: 'Created a new project at https?://[^\s/]+/dashboard/project/(?P<ref>[a-z]{20})\b'
        value: "{ref}"

  - id: supabase.cli.branches_create
    kind: branch
    role: created
    when: { tool: ^Bash$, command: ['\bsupabase\s+branches\s+create\b'] }
    extract:
      - from: output # text table: ID column holds the branch ref
        pattern: 'Created preview branch:[\s\S]*?\n\s*-[-|]+\n\s*(?P<ref>[a-z]{20})\s*\|'
        value: "{ref}"
      - from: output # -o json
        pattern: '"project_ref"\s*:\s*"(?P<ref>[a-z]{20})"'
        value: "{ref}"

  - id: supabase.cli.functions_deploy
    kind: function
    role: created
    when: { tool: ^Bash$, command: ['\bsupabase\s+functions\s+deploy\b'] }
    extract:
      - from: output
        pattern: 'Deployed Functions on project (?P<ref>[a-z]{20}): (?P<slugs>[A-Za-z][A-Za-z0-9_-]*(?:, [A-Za-z][A-Za-z0-9_-]*)*)'
        split: { field: slugs, sep: "," }
        value: "{slugs}"
        container: "{ref}"
      - from: result # --output-format json: {project_ref, functions:[slugs], dashboard_url}
        each: result.functions
        value: "{item}"
        container: "{result.project_ref}"

  - id: supabase.cli.db_query
    kind: table
    role: created
    when: { tool: ^Bash$, command: ['\bsupabase\s+db\s+query\b'] }
    extract:
      - &sql_create_table
        from: command
        pattern: '(?i)\bcreate\s+(?:unlogged\s+)?table\s+(?:if\s+not\s+exists\s+)?(?:(?P<schema>"(?:[^"]|"")+"|[A-Za-z_][A-Za-z0-9_$]*)\s*\.\s*)?(?P<name>"(?:[^"]|"")+"|[A-Za-z_][A-Za-z0-9_$]*)'
        capture: [{ from: command, pattern: '--project-ref[= ](?P<ref>[a-z]{20})\b' }]
        value: "{schema|pg_ident|default:public}.{name|pg_ident}"
        container: "{ref}"
      - &sql_insert_bucket
        kind: bucket
        from: command
        pattern: '(?i)\binsert\s+into\s+"?storage"?\s*\.\s*"?buckets"?\s*\(\s*"?id"?\s*,[^)]*\)\s*values\s*\(\s*''(?P<id>[^'']+)'''
        capture: [{ from: command, pattern: '--project-ref[= ](?P<ref>[a-z]{20})\b' }]
        value: "{id}"
        container: "{ref}"

  - id: supabase.cli.seed_buckets
    kind: bucket
    role: created
    when: { tool: ^Bash$, command: ['\bsupabase\s+seed\s+buckets\b'] }
    extract:
      - from: output
        pattern: 'Creating Storage bucket: (?P<id>\S+)'
        capture: [{ from: command, pattern: '--project-ref[= ](?P<ref>[a-z]{20})\b' }]
        value: "{id}"
        container: "{ref}"

  - id: supabase.cli.link
    kind: project
    role: referenced
    when: { tool: ^Bash$, command: ['\bsupabase\s+link\b'] }
    extract:
      - from: command
        pattern: '--project-ref[= ](?P<ref>[a-z]{20})\b'
        value: "{ref}"

  # A migration file written by the agent is evidence, not creation: the table
  # exists only after `supabase db push` or apply_migration.
  - id: supabase.file.migration
    kind: table
    role: referenced
    when: { tool: ^Write$, input_matches: { file_path: 'supabase/migrations/[^/]+\.sql$' } }
    extract:
      - <<: *sql_create_table
        from: input.content
        capture: []
        container: "{ref}"

  # ---- Management API through curl. ----
  - id: supabase.api.create_project
    kind: project
    role: created
    when:
      tool: ^Bash$
      command: ['\bcurl\b', 'api\.supabase\.com/v1/projects(?:[''"\s]|$)', '(?:-X\s*POST|--request\s+POST|\s-d\s|--data)']
      result_lacks: [message, error]
    extract:
      - from: output
        pattern: '"ref"\s*:\s*"(?P<ref>[a-z]{20})"'
        value: "{ref}"

  - id: supabase.api.create_branch
    kind: branch
    role: created
    when:
      tool: ^Bash$
      command: ['\bcurl\b', 'api\.supabase\.com/v[12]/projects/[a-z]{20}/branches(?:[''"\s]|$)', '(?:-X\s*POST|--request\s+POST|\s-d\s|--data)']
    extract:
      - from: output
        pattern: '"project_ref"\s*:\s*"(?P<ref>[a-z]{20})"'
        value: "{ref}"

  # ---- Stripe Projects: a known creation path. Ids only if printed. ----
  - id: supabase.stripe_projects.add
    kind: project
    role: created
    when: { tool: ^Bash$, command: ['\bstripe\s+projects\s+add\s+supabase/'] }
    extract:
      - from: output
        pattern: 'https?://supabase\.com/dashboard/project/(?P<ref>[a-z]{20})\b'
        value: "{ref}"
      - from: output
        pattern: '"ref"\s*:\s*"(?P<ref>[a-z]{20})"'
        value: "{ref}"

  # ---- Supabase MCP server (github.com/supabase/mcp). Results are JSON text. ----
  - id: supabase.mcp.create_project
    kind: project
    role: created
    when: { mcp_tools: [create_project], result_lacks: [error] }
    extract:
      - { from: result, value: "{result.ref}" }

  - id: supabase.mcp.create_branch
    kind: branch
    role: created
    when: { mcp_tools: [create_branch], result_lacks: [error] }
    extract:
      - { from: result, value: "{result.project_ref}", container: "{input.project_id}" }

  - id: supabase.mcp.deploy_edge_function
    kind: function
    role: created
    when: { mcp_tools: [deploy_edge_function], result_lacks: [error] }
    extract:
      - { from: result, value: "{result.slug|or:input.name}", container: "{input.project_id}" }

  - id: supabase.mcp.sql
    kind: table
    role: created
    when: { mcp_tools: [apply_migration, execute_sql], result_lacks: [error] }
    extract:
      - <<: *sql_create_table
        from: input.query
        capture: []
        container: "{input.project_id}"
      - <<: *sql_insert_bucket
        from: input.query
        capture: []
        container: "{input.project_id}"

  # Read-only MCP calls: ids appear, nothing was created.
  - id: supabase.mcp.read_projects
    kind: project
    role: referenced
    when: { mcp_tools: [list_projects, get_project], result_lacks: [error] }
    extract:
      - { from: result, each: result.projects, value: "{item.ref}" }
      - { from: result, value: "{result.ref}" }
  - id: supabase.mcp.read_branches
    kind: branch
    role: referenced
    when: { mcp_tools: [list_branches], result_lacks: [error] }
    extract:
      - { from: result, each: result.branches, value: "{item.project_ref}" }
  - id: supabase.mcp.read_functions
    kind: function
    role: referenced
    when: { mcp_tools: [list_edge_functions, get_edge_function], result_lacks: [error] }
    extract:
      - { from: result, each: result.functions, value: "{item.slug}", container: "{input.project_id}" }
      - { from: result, value: "{result.slug}", container: "{input.project_id}" }
  - id: supabase.mcp.read_buckets
    kind: bucket
    role: referenced
    when: { mcp_tools: [list_storage_buckets], result_lacks: [error] }
    extract:
      - { from: result, each: result.buckets, value: "{item.id}", container: "{input.project_id}" }
  - id: supabase.mcp.read_tables
    kind: table
    role: referenced
    when: { mcp_tools: [list_tables], result_lacks: [error] }
    extract:
      - { from: result, each: result.tables, value: "{item.name}", container: "{input.project_id}" }

coverage:
  - { kind: project, status: full, note: "GET /v1/projects" }
  - { kind: branch, status: full, note: "GET /v1/projects/{ref}/branches; paid plans only" }
  - { kind: function, status: full, note: "GET /v1/projects/{ref}/functions" }
  - { kind: bucket, status: full, note: "GET /v1/projects/{ref}/storage/buckets; analytics and vector buckets not included" }
  - { kind: table, status: partial, note: "Advisor-flagged and agent-created tables; every table with the opt-in catalog_rls option" }
  - { kind: schema, status: planned, note: "Needs the opt-in catalog read" }
  - { kind: view, status: planned, note: "Catalog read; advisor lints security_definer_view" }
  - { kind: edge_function_secret, status: planned, note: "Names only" }
  - { kind: custom_domain, status: planned, note: "GET /v1/projects/{ref}/custom-hostname" }
  - { kind: read_replica, status: planned, note: "GET /v2/organizations/{slug}/projects databases[]" }
  - { kind: queue, status: planned, note: "pgmq, catalog read only" }
  - { kind: cron_job, status: planned, note: "pg_cron, catalog read only" }
  - { kind: platform_webhook, status: planned, note: "GET /v2/projects/{ref}/webhooks/endpoints" }
  - { kind: vector_bucket, status: planned, note: "Storage API only; no Management API list" }

recorder:
  pseudonymize: [ref, id, project_ref, parent_project_ref, organization_id, organization_slug, slug, name, git_branch, owner, host, entrypoint_path, import_map_path, cache_key, detail, metadata.schema, metadata.name, schema]
  keep: [rls_disabled_in_public, advisor_check_unavailable, db_not_reachable, project_not_active, public, main, develop]
