# Built from the response schemas in Cloudflare's OpenAPI spec (api-schemas
# 4.0.0, 2026-10-30) with the {success, errors, messages, result, result_info}
# envelope; no live recording yet. All ids are fakes.
# R2: example-assets (r2.dev on + custom domain), example-uploads (r2.dev off
# + custom domain), example-private (r2.dev state unreadable: unknown), over
# two cursor pages. Workers over two pages; example-legacy has no subdomain
# object (unknown). Tunnel example-dev routes to localhost, a database port and
# two Access-protected origins. Every stripped field holds MURETTO_FAKE_SECRET.
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/r2/buckets, query: { per_page: "1000" }, file: r2-buckets-1.json }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/r2/buckets, query: { per_page: "1000", cursor: EXAMPLEcursor0001 }, file: r2-buckets-2.json }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/r2/buckets/example-assets/domains/managed, file: r2-managed-assets.json }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/r2/buckets/example-uploads/domains/managed, file: r2-managed-uploads.json }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/r2/buckets/example-private/domains/managed, status: 404, body: '{"success":false,"errors":[{"code":10006,"message":"Not found"}],"messages":[],"result":null}' }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/r2/buckets/example-assets/domains/custom, file: r2-custom-assets.json }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/r2/buckets/example-uploads/domains/custom, file: r2-custom-uploads.json }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/r2/buckets/example-private/domains/custom, body: '{"success":true,"errors":[],"messages":[],"result":{"domains":[]}}' }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/workers/workers, query: { per_page: "100" }, file: workers-1.json }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/workers/workers, query: { per_page: "100", page: "2" }, file: workers-2.json }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/pages/projects, file: pages-projects.json }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/pages/projects/example-site/deployments, file: pages-deployments.json }
# D1, KV and tunnel lists document no total_pages: paged until an empty page.
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/d1/database, query: { per_page: "1000" }, file: d1.json }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/d1/database, query: { per_page: "1000", page: "2" }, body: '{"success":true,"errors":[],"messages":[],"result":[],"result_info":{"page":2,"per_page":1000,"count":0,"total_count":1}}' }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/storage/kv/namespaces, query: { per_page: "1000" }, file: kv.json }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/storage/kv/namespaces, query: { per_page: "1000", page: "2" }, file: kv-2.json }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/storage/kv/namespaces, query: { per_page: "1000", page: "3" }, body: '{"success":true,"errors":[],"messages":[],"result":[],"result_info":{"page":2,"per_page":1000,"count":0,"total_count":1}}' }
- { path: /client/v4/zones, query: { account.id: 0123456789abcdef0123456789abcdef }, file: zones.json }
- { path: /client/v4/zones/0123456789abcdef0123456789abcd10/dns_records, query: { per_page: "1000" }, file: dns-1.json }
- { path: /client/v4/zones/0123456789abcdef0123456789abcd10/dns_records, query: { per_page: "1000", page: "2" }, file: dns-2.json }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/cfd_tunnel, query: { is_deleted: "false" }, file: tunnels.json }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/cfd_tunnel, query: { is_deleted: "false", page: "2" }, body: '{"success":true,"errors":[],"messages":[],"result":[],"result_info":{"page":2,"per_page":1000,"count":0,"total_count":1}}' }
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/cfd_tunnel/01234567-0000-4000-8000-0000000000f1/configurations, file: tunnel-config-dev.json }
# example-local (config_src: local) is skipped by for_each_where; its enrich call still runs.
- { path: /client/v4/accounts/0123456789abcdef0123456789abcdef/cfd_tunnel/01234567-0000-4000-8000-0000000000f2/configurations, file: tunnel-config-local.json }
