# Sandbox-and-live mix in one account (shapes from the API reference list and
# create examples, docs/research/stripe.md). Two live webhooks (a Vercel
# branch-preview host and a stable host subscribed to "*"), a sandbox webhook
# to an ngrok dev domain, live and sandbox products, prices and payment links.
- { path: /v1/account, file: account.json }
- { path: /v1/webhook_endpoints, query: { limit: "100" }, file: webhook-endpoints.json }
- { path: /v1/products, query: { limit: "100" }, file: products.json }
- { path: /v1/prices, query: { limit: "100" }, file: prices.json }
- { path: /v1/prices, query: { active: "false", limit: "100" }, file: prices-inactive.json }
- { path: /v1/payment_links, query: { limit: "100" }, file: payment-links.json }
- { path: /v1/billing_portal/configurations, query: { limit: "100" }, file: portal-configurations.json }
