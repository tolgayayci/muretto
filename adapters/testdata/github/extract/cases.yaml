  matches: [github.environment:5000001]

- name: MCP create_repository returns the minimal id and url
  tool: mcp__github__create_repository
  input: { name: agent-landing, private: false }
  output: '{"id":"2000001","url":"https://github.com/octo-example/agent-landing"}'
  expect:
    - { kind: github.repo, value: "2000001", role: created }
  matches: [github.repo:2000001]

- name: MCP create_repository through the claude.ai connector name
  tool: mcp__claude_ai_GitHub__create_repository
  input: { name: internal-api, organization: example-org }
  output: '{"id":"2000003","url":"https://github.com/example-org/internal-api"}'
  expect:
    - { kind: github.repo, value: "2000003", role: created }
  matches: [github.repo:2000003]

- name: MCP create_repository error proves nothing
  tool: mcp__github__create_repository
  input: { name: agent-landing }
  output: 'failed to create repository: POST https://api.github.com/user/repos: 422 Repository creation failed. [{Resource:Repository Field:name Code:custom Message:name already exists on this account}]'
  expect: []

- name: MCP fork_repository may return an existing fork, so it only references
  tool: mcp__github__fork_repository
  input: { owner: example-upstream, repo: private-notes }
  output: '{"id":"2000002","url":"https://github.com/octo-example/private-notes"}'
  expect:
    - { kind: github.repo, value: "2000002", role: referenced }

- name: MCP fork_repository still in progress proves nothing
  tool: mcp__github__fork_repository
  input: { owner: example-upstream, repo: private-notes }
  output: "Fork is in progress"
  expect: []
