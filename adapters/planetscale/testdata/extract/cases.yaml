# Extract cases built from the pscale CLI output strings (planetscale/cli
# v0.348.0) and API response shapes documented in adapters/planetscale/research.md.
# All names and ids are fakes. Credentials in outputs appear as the hook
# leaves them ([REDACTED]). `expect` is the exact set of identifiers.

# ---- pscale database create ----
- name: CLI database create (text)
  tool: Bash
  input: { command: "pscale database create example-db --org example-org --region us-east" }
  output: |
    Database example-db was successfully created.

    View this database in the browser: https://app.planetscale.com/example-org/example-db
  expect:
    - { kind: planetscale.database, value: example-db, container: example-org, role: created }
  matches: [planetscale.database:example-org/example-db]

- name: CLI db create --engine postgresql with ANSI colours
  tool: Bash
  input: { command: "pscale db create example-pg --engine postgresql" }
  output: "\e[1;34mDatabase \e[0m\e[1;34mexample-pg\e[0m was successfully created.\n\nView this database in the browser: \e[1;34mhttps://app.planetscale.com/example-org/example-pg\e[0m\n"
  expect:
    - { kind: planetscale.database, value: example-pg, container: example-org, role: created }
  matches: [planetscale.database:example-org/example-pg]

- name: CLI database create --format json
  tool: Bash
  input: { command: "pscale database create example-db --format json" }
  output: |
    {
      "name": "example-db",
      "notes": "",
      "region": { "slug": "us-east" },
      "state": "pending",
      "kind": "mysql",
      "html_url": "https://app.planetscale.com/example-org/example-db",
      "default_branch": "main",
      "created_at": "2026-10-30T10:00:00Z"
    }
  expect:
    - { kind: planetscale.database, value: example-db, container: example-org, role: created }

- name: CLI database create that failed
  tool: Bash
  status: error
  input: { command: "pscale database create example-db" }
  output: "Error: organization example-org does not exist"
  expect: []

- name: CLI database list is read-only
  tool: Bash
  input: { command: "pscale database list --org example-org" }
  output: |
    NAME         CREATED AT     UPDATED AT
    example-db   2 months ago   1 day ago
  expect: []

# ---- pscale branch create ----
- name: CLI branch create, Vitess (text)
  tool: Bash
  input: { command: "pscale branch create example-db feature-x --from main --org example-org" }
  output: |
    Branch feature-x was successfully created.

    View this branch in the browser: https://app.planetscale.com/example-org/example-db/feature-x
  expect:
    - { kind: planetscale.branch, value: feature-x, container: example-db, role: created }
  matches: [planetscale.branch:example-org/example-db/feature-x]

- name: CLI branch create, Vitess (json)
  tool: Bash
  input: { command: "pscale branch create example-db feature-x --format json" }
  output: '{"id":"brEXAMPLE0002","name":"feature-x","parent_branch":"main","ready":false,"production":false,"html_url":"https://app.planetscale.com/example-org/example-db/feature-x","safe_migrations":false}'
  expect:
    - { kind: planetscale.branch, value: feature-x, container: example-db, role: created }

- name: CLI branch create, Postgres (text)
  tool: Bash
  input: { command: "pscale branch create example-pg dev --org example-org" }
  output: "Branch dev was successfully created in example-pg.\n"
  expect:
    - { kind: planetscale.branch, value: dev, container: example-pg, role: created }

- name: CLI branch create, Postgres main (matches fixture)
  tool: Bash
  input: { command: "pscale branch create example-pg main" }
  output: "Branch main was successfully created in example-pg.\n"
  expect:
    - { kind: planetscale.branch, value: main, container: example-pg, role: created }
  matches: [planetscale.branch:example-org/example-pg/main]

- name: CLI branch create that failed
  tool: Bash
  status: error
  input: { command: "pscale branch create example-db feature-x" }
  output: "Error: source database example-db does not exist in organization example-org"
  expect: []

# ---- pscale password create (prints credentials; only names are read) ----
- name: CLI password create (text)
  tool: Bash
  input: { command: "pscale password create example-db main agent-admin --role admin --org example-org" }
  output: |
    Password agent-admin was successfully created in example-db/main.
    Please save the values below as they will not be shown again

      NAME          BRANCH   ID              USERNAME          ACCESS HOST URL          ROLE    ROLE DESCRIPTION                  PASSWORD
     ------------- -------- --------------- ----------------- ------------------------ ------- --------------------------------- ------------
      agent-admin   main     pwEXAMPLE0001   exampleuser0001   aws.connect.psdb.cloud   admin   Can Read, Write & Administer      [REDACTED]
  expect:
    - { kind: planetscale.password, value: agent-admin, container: example-db/main, role: created }
  matches: [planetscale.password:example-org/example-db/main/pwEXAMPLE0001]

- name: CLI password create --format json
  tool: Bash
  input: { command: "pscale password create example-db main agent-admin --format json" }
  output: '{"id":"pwEXAMPLE0001","name":"agent-admin","access_host_url":"aws.connect.psdb.cloud","username":"exampleuser0001","role":"admin","database_branch":{"name":"main","production":true},"plain_text":"[REDACTED]","ttl_seconds":0,"cidrs":null}'
  expect:
    - { kind: planetscale.password, value: pwEXAMPLE0001, role: created }
  matches: [planetscale.password:example-org/example-db/main/pwEXAMPLE0001]

- name: CLI password list is read-only
  tool: Bash
  input: { command: "pscale password list example-db main" }
  output: |
    NAME          ID              ROLE
    agent-admin   pwEXAMPLE0001   admin
  expect: []

# ---- pscale role create (Postgres) ----
- name: CLI role create (text)
  tool: Bash
  input: { command: "pscale role create example-pg main agent-admin-role --inherited-roles postgres" }
  output: |
    Role agent-admin-role was successfully created in example-pg/main.
    Please save the values below as they will not be shown again

    Username: agent-admin-role.exampleuser02
    Password: [REDACTED]
  expect:
    - { kind: planetscale.role, value: agent-admin-role, container: example-pg/main, role: created }
  matches: [planetscale.role:example-org/example-pg/main/roleEXAMPLE02]

- name: CLI role create --format json
  tool: Bash
  input: { command: "pscale role create example-pg main agent-admin-role --inherited-roles postgres --format json" }
  output: '{"id":"roleEXAMPLE02","name":"agent-admin-role","username":"agent-admin-role.exampleuser02","password":"[REDACTED]","expires_at":null}'
  expect:
    - { kind: planetscale.role, value: roleEXAMPLE02, role: created }
  matches: [planetscale.role:example-org/example-pg/main/roleEXAMPLE02]

# ---- pscale deploy-request create ----
- name: CLI deploy-request create (text)
  tool: Bash
  input: { command: "pscale deploy-request create example-db feature-x --org example-org" }
  output: |
    Deploy request #1 successfully created.

    View this deploy request in the browser: https://app.planetscale.com/example-org/example-db/deploy-requests/1
  expect:
    - { kind: planetscale.deploy_request, value: "1", container: example-db, role: created }
  matches: [planetscale.deploy_request:example-org/example-db/1]

- name: CLI dr create --format json
  tool: Bash
  input: { command: "pscale dr create example-db feature-x --format json" }
  output: '{"id":"drEXAMPLE0001","branch":"feature-x","into_branch":"main","number":1,"state":"open","html_url":"https://app.planetscale.com/example-org/example-db/deploy-requests/1"}'
  expect:
    - { kind: planetscale.deploy_request, value: "1", container: example-db, role: created }

# ---- Raw API (curl and pscale api) ----
- name: curl create database
  tool: Bash
  input: { command: "curl -s --request POST --url https://api.planetscale.com/v1/organizations/example-org/databases --header 'Authorization: [REDACTED]' --header 'content-type: application/json' --data '{\"name\":\"example-db\"}'" }
  output: '{"id":"dbEXAMPLE0001","type":"Database","name":"example-db","kind":"mysql","state":"pending","html_url":"https://app.planetscale.com/example-org/example-db"}'
  expect:
    - { kind: planetscale.database, value: example-db, container: example-org, role: created }
  matches: [planetscale.database:example-org/example-db]

- name: curl create database that failed
  tool: Bash
  input: { command: "curl -s -X POST https://api.planetscale.com/v1/organizations/example-org/databases -H 'Authorization: [REDACTED]' -d '{\"name\":\"example-db\"}'" }
  output: '{"code":"not_found","message":"Not Found"}'
  expect: []

- name: curl GET databases is read-only
  tool: Bash
  input: { command: "curl -s https://api.planetscale.com/v1/organizations/example-org/databases -H 'Authorization: [REDACTED]'" }
  output: '{"type":"list","data":[{"id":"dbEXAMPLE0001","name":"example-db"}]}'
  expect: []

- name: curl create branch
  tool: Bash
  input: { command: "curl --request POST --url https://api.planetscale.com/v1/organizations/example-org/databases/example-db/branches --header 'Authorization: [REDACTED]' --data '{\"name\":\"feature-x\",\"parent_branch\":\"main\"}'" }
  output: '{"id":"brEXAMPLE0002","type":"Branch","name":"feature-x","production":false,"html_url":"https://app.planetscale.com/example-org/example-db/feature-x","parent_branch":"main"}'
  expect:
    - { kind: planetscale.branch, value: feature-x, container: example-db, role: created }
  matches: [planetscale.branch:example-org/example-db/feature-x]

- name: pscale api create Postgres branch
  tool: Bash
  input: { command: "pscale api organizations/example-org/databases/example-pg/branches -F name=main -F parent_branch=prod" }
  output: '{"id":"brEXAMPLE0003","type":"PostgresBranch","name":"main","kind":"postgresql"}'
  expect:
    - { kind: planetscale.branch, value: main, container: example-pg, role: created }
  matches: [planetscale.branch:example-org/example-pg/main]

- name: curl create password (plain_text redacted)
  tool: Bash
  input: { command: "curl -X POST https://api.planetscale.com/v1/organizations/example-org/databases/example-db/branches/main/passwords -H 'Authorization: [REDACTED]' -d '{\"name\":\"agent-admin\",\"role\":\"admin\"}'" }
  output: '{"id":"pwEXAMPLE0001","type":"Password","name":"agent-admin","role":"admin","plain_text":"[REDACTED]","expires_at":null}'
  expect:
    - { kind: planetscale.password, value: pwEXAMPLE0001, role: created }
  matches: [planetscale.password:example-org/example-db/main/pwEXAMPLE0001]

- name: curl PATCH password is not a create
  tool: Bash
  input: { command: "curl -X PATCH https://api.planetscale.com/v1/organizations/example-org/databases/example-db/branches/main/passwords -H 'Authorization: [REDACTED]' -d '{\"cidrs\":[]}'" }
  output: '{"id":"pwEXAMPLE0001","name":"agent-admin"}'
  expect: []

- name: curl create role
  tool: Bash
  input: { command: "curl -X POST https://api.planetscale.com/v1/organizations/example-org/databases/example-pg/branches/main/roles -H 'Authorization: [REDACTED]' -d '{\"name\":\"agent-admin-role\",\"inherited_roles\":[\"postgres\"]}'" }
  output: '{"id":"roleEXAMPLE02","type":"PostgresRole","name":"agent-admin-role","password":"[REDACTED]"}'
  expect:
    - { kind: planetscale.role, value: roleEXAMPLE02, role: created }
  matches: [planetscale.role:example-org/example-pg/main/roleEXAMPLE02]

- name: curl create deploy request
  tool: Bash
  input: { command: "curl -X POST https://api.planetscale.com/v1/organizations/example-org/databases/example-db/deploy-requests -H 'Authorization: [REDACTED]' -d '{\"branch\":\"feature-x\",\"into_branch\":\"main\"}'" }
  output: '{"id":"drEXAMPLE0001","type":"DeployRequest","number":1,"branch":"feature-x","into_branch":"main","state":"open"}'
  expect:
    - { kind: planetscale.deploy_request, value: "1", container: example-db, role: created }
  matches: [planetscale.deploy_request:example-org/example-db/1]

# ---- Stripe Projects ----
- name: Stripe Projects add planetscale/postgresql (dashboard URL printed)
  tool: Bash
  input: { command: "stripe projects add planetscale/postgresql --no-interactive --json" }
  output: '{"service":"planetscale/postgresql","dashboard_url":"https://app.planetscale.com/example-org/example-pg"}'
  expect:
    - { kind: planetscale.database, value: example-pg, container: example-org, role: created }
  matches: [planetscale.database:example-org/example-pg]

- name: Stripe Projects add without ids proves nothing
  tool: Bash
  input: { command: "stripe projects add planetscale/mysql --no-interactive" }
  output: "Added planetscale/mysql. Run stripe projects env --sync to pull credentials."
  expect: []
