# PlanetScale adapter. Every endpoint, field and output string here comes from
# adapters/planetscale/research.md (checked 2026-11-01). Format: adapters/WRITING.md.
# Not yet verified live.
format: 1
provider: planetscale
display_name: PlanetScale

api:
  base_url: https://api.planetscale.com
  # Service tokens go in the Authorization header without a scheme:
  # "Authorization: <SERVICE_TOKEN_ID>:<SERVICE_TOKEN>". The stored token is
  # that whole "id:token" string.
  auth: { header: Authorization }

# The hosted MCP server (https://mcp.pscale.dev/mcp/planetscale) has no tools
# that create databases, branches, passwords or roles, so there are no MCP
# signatures. The name is declared so future signatures can use it.
mcp_servers: [planetscale]

token_help: |
  Paste a PlanetScale service token as "<SERVICE_TOKEN_ID>:<SERVICE_TOKEN>"
  (both values, joined by a colon).
  Create it in the dashboard: Settings > Service tokens > New service token.
  Copy the ID and the token, then click "Edit token permissions" and grant
  only these read permissions:
    Organization access: read_organization, read_databases
    Database access (each database, or "Permissions for all databases",
    which only org admins can grant): read_database, read_branch,
    read_deploy_request
  Do not grant any create_, write_, delete_, connect_, approve_ or restore_
  permission. With these grants the token can read database, branch,
  password and role metadata and deploy requests; it cannot create, change
  or delete anything, and it cannot read password values (the API returns
  them only once, when a password is created). Muretto only sends GET
  requests to the endpoints in this file, enforced in code.

# Never add (adapters/planetscale/research.md "Never call"): any POST/PATCH/PUT/
# DELETE, .../passwords/{id}/renew, .../roles/{id}/reset, .../roles/reset-default,
# .../roles/{id} with replica/bouncer/router query (connection details),
# .../webhooks (returns the signing secret), /service-tokens,
# /oauth-applications/**.
endpoints:
  organizations:
    path: /v1/organizations
    query: { per_page: "100" }
    pagination: { next: next_page, param: page }
  databases:
    path: /v1/organizations/{organization}/databases
    params: { organization: "{account}" }
    query: { per_page: "100" }
    pagination: { next: next_page, param: page }
  branches:
    path: /v1/organizations/{organization}/databases/{database}/branches
    params: { organization: "{account}", database: "{parent.name}" }
    query: { per_page: "100" }
    pagination: { next: next_page, param: page }
  passwords:
    path: /v1/organizations/{organization}/databases/{database}/branches/{branch}/passwords
    params: { organization: "{account}", database: "{parent.database}", branch: "{parent.name}" }
    query: { per_page: "100" }
    pagination: { next: next_page, param: page }
    # "The plaintext password. Null except in the response from the create
    # endpoint." Stripped anyway.
    strip: ["data[].plain_text"]
  roles:
    path: /v1/organizations/{organization}/databases/{database}/branches/{branch}/roles
    params: { organization: "{account}", database: "{parent.database}", branch: "{parent.name}" }
    query: { per_page: "100" }
    pagination: { next: next_page, param: page }
    # password: "The plaintext password, available only after create".
    # access_host_url: described by the spec as "The database connection string".
    strip: ["data[].password", "data[].access_host_url", "data[].private_access_host_url"]
  deploy_requests:
    path: /v1/organizations/{organization}/databases/{database}/deploy-requests
    params: { organization: "{account}", database: "{parent.name}" }
    query: { per_page: "100" }
    pagination: { next: next_page, param: page }

# Path parameters take the organization NAME, so the account id is the name.
accounts:
  endpoint: organizations
  items: data
  id: "{name}"
  name: "{name}"
  slug: "{name}"
account_slug: "{account}"

kinds:
  - kind: database
    sources:
      - endpoint: databases
        items: data
        id: "{account}/{name}"
        name: "{name}"
        status: "{state|lower}"
        url: "{html_url}"
        created_at: { value: "{created_at}", format: rfc3339 }
        attributes:
          - { name: database_id, field: id }
          - { name: engine, field: kind } # mysql (Vitess), postgresql, neki
          - { name: region, field: region.slug }
          - plan
          - ready
          - default_branch
          - deletion_protected
          - require_approval_for_deploy
    match: { value: "{name}", container: "{account_slug}" }

  # Every engine (mysql = Vitess, postgresql, neki). Children pick their
  # engine with for_each_where on the documented kind field.
  - kind: branch
    for_each: database
    sources:
      - endpoint: branches
        items: data
        checks_rules: [unprotected_production_branch]
        id: "{parent.provider_id}/{name}"
        name: "{name}"
        status: "{state|lower}"
        url: "{html_url}"
        created_at: { value: "{created_at}", format: rfc3339 }
        attributes:
          - { name: branch_id, field: id }
          - { name: database, template: "{parent.name}" }
          - { name: engine, field: kind }
          - production
          - safe_migrations
          - parent_branch
          - ready
          - deletion_protected
          - { name: region, field: region.slug }
    match: { value: "{name}", container: "{database}" }

  # Passwords are Vitess-only.
  - kind: password
    for_each: branch
    for_each_where: { field: engine, equals: mysql }
    sources:
      - endpoint: passwords
        items: data
        where:
          any:
            - { field: deleted_at, present: false }
            - { field: deleted_at, is_null: true }
        checks_rules: [permanent_admin_password, unrestricted_password, long_lived_password]
        id: "{parent.provider_id}/{id}"
        name: "{name}"
        created_at: { value: "{created_at}", format: rfc3339 }
        attributes:
          - { name: password_id, field: id }
          - { name: database, template: "{parent.database}" }
          - { name: branch, template: "{parent.name}" }
          - { name: production, template: "{parent.production}" }
          - role
          - expires_at
          - expired
          - ttl_seconds
          - last_used_at
          - cidrs
          - replica
    match: { value: "{name}", container: "{database}/{branch}" }

  # Roles are the Postgres and Neki credentials.
  - kind: role
    for_each: branch
    for_each_where: { field: engine, in: [postgresql, neki] }
    sources:
      - endpoint: roles
        items: data
        where:
          any:
            - { field: deleted_at, present: false }
            - { field: deleted_at, is_null: true }
        checks_rules: [permanent_admin_role]
        id: "{parent.provider_id}/{id}"
        name: "{name}"
        created_at: { value: "{created_at}", format: rfc3339 }
        attributes:
          - { name: role_id, field: id }
          - { name: database, template: "{parent.database}" }
          - { name: branch, template: "{parent.name}" }
          - inherited_roles
          - default
          - expires_at
          - expired
          - ttl
          - with_replication
          - disabled_at
    match: { value: "{name}", container: "{database}/{branch}" }

  # Deploy requests are a Vitess workflow.
  - kind: deploy_request
    for_each: database
    for_each_where: { field: engine, equals: mysql }
    sources:
      - endpoint: deploy_requests
        items: data
        id: "{parent.provider_id}/{number}"
        name: "#{number} {branch} -> {into_branch}"
        status: "{state|lower}"
        url: "{html_url}"
        created_at: { value: "{created_at}", format: rfc3339 }
        attributes:
          - number
          - { name: database, template: "{parent.name}" }
          - branch
          - into_branch
          - approved
          - deployment_state
    match: { value: "{number}", container: "{database}" }

rules:
  - id: permanent_admin_password
    kind: password
    severity: medium
    signal: api_field
    applies: { field: expired, equals: "false" }
    exposed:
      all:
        - { field: role, equals: admin }
        - { field: expires_at, is_null: true }
    title: "Admin password that never expires: {name} on {database}/{branch}"
    explanation: >-
      The API reports that password {name} on branch {database}/{branch} has
      the admin role (all read/write permissions, and it can change the
      schema) and no expiry date.
    caveat: >-
      The API does not say where the password is stored or who holds it.
      Passwords created before TTLs existed, and passwords made with the
      default --ttl 0, never expire.

  - id: unrestricted_password
    kind: password
    severity: low
    signal: api_field
    applies: { field: expired, equals: "false" }
    exposed:
      any:
        - { field: cidrs, is_null: true }
        - { field: cidrs, equals: "" }
    not_exposed: { field: cidrs, matches: '.' }
    title: "Password usable from any IP: {name} on {database}/{branch}"
    explanation: >-
      The API reports no IP restrictions (cidrs) on password {name} for
      branch {database}/{branch}. PlanetScale documents that a password with
      no IP restrictions allows all traffic.
    caveat: >-
      The password value is still needed to connect; the API cannot say
      whether it has leaked. Some passwords cannot take IP restrictions and
      must be recreated.

  - id: long_lived_password
    kind: password
    severity: low
    signal: api_field
    applies: { field: expired, equals: "false" }
    exposed:
      all:
        - { field: expires_at, is_null: true }
        - { field: created_at, older_than: 30d }
    not_exposed:
      any:
        - { field: expires_at, is_null: false }
        - { field: created_at, newer_than: 30d }
    title: "Password older than 30 days with no expiry: {name} on {database}/{branch}"
    explanation: >-
      The API reports that password {name} on branch {database}/{branch} was
      created more than 30 days ago and has no expiry date.
    caveat: >-
      last_used_at shows whether it is still used; the API cannot say who
      holds it.

  - id: unprotected_production_branch
    kind: branch
    severity: medium
    signal: api_field
    applies:
      all:
        - { field: production, equals: "true" }
        - { field: engine, equals: mysql }
    exposed: { field: safe_migrations, equals: "false" }
    title: "Production branch without safe migrations: {database}/{name}"
    explanation: >-
      The API reports that production branch {name} of database {database}
      has safe migrations off, so DDL sent directly to the branch is not
      rejected, and admin passwords can change its schema.
    caveat: >-
      The API does not say who holds admin passwords for the branch; see the
      branch's passwords.

  - id: permanent_admin_role
    kind: role
    severity: medium
    signal: api_field
    applies:
      all:
        - { field: expired, equals: "false" }
        - { field: default, equals: "false" }
    exposed:
      all:
        - { field: inherited_roles, contains_any: [postgres] }
        - { field: expires_at, is_null: true }
    title: "Admin Postgres role that never expires: {name} on {database}/{branch}"
    explanation: >-
      The API reports that role {name} on branch {database}/{branch}
      inherits the postgres role (admin access) and has no expiry date.
    caveat: >-
      The branch's default role is not checked here. The API cannot say who
      holds the role's password.

signatures:
  # ---- pscale CLI (Bash). Output strings from planetscale/cli v0.348.0. ----
  # Text: "Database <name> was successfully created.\n\nView this database in
  # the browser: <html_url>". JSON (--format json): the API database object.
  - id: planetscale.cli.database_create
    kind: database
    role: created
    when: { tool: ^Bash$, command: ['\bpscale\s+(?:database|db)\s+create\b'] }
    extract:
      - from: output
        pattern: 'Database \S+ was successfully created\.\s+View this database in the browser: https://app\.planetscale\.com/(?P<org>[^/\s]+)/(?P<db>[^/\s]+)'
        value: "{db}"
        container: "{org}"
      - from: output
        pattern: '"html_url"\s*:\s*"https://app\.planetscale\.com/(?P<org>[^/"]+)/(?P<db>[^/"]+)"'
        value: "{db}"
        container: "{org}"

  # Vitess text: "Branch <name> was successfully created.\n\nView this branch
  # in the browser: <html_url>". Postgres text: "Branch <name> was
  # successfully created in <database>.". JSON: the API branch object.
  - id: planetscale.cli.branch_create
    kind: branch
    role: created
    when: { tool: ^Bash$, command: ['\bpscale\s+branch\s+create\b'] }
    extract:
      - from: output
        pattern: 'Branch \S+ was successfully created\.\s+View this branch in the browser: https://app\.planetscale\.com/[^/\s]+/(?P<db>[^/\s]+)/(?P<branch>[^/\s]+)'
        value: "{branch}"
        container: "{db}"
      - from: output
        pattern: 'Branch (?P<branch>\S+) was successfully created in (?P<db>[A-Za-z0-9_-]+)\.'
        value: "{branch}"
        container: "{db}"
      - from: result
        value: "{result.name}"
        capture:
          - { from: command, pattern: '\bpscale\s+branch\s+create\s+(?P<db>[A-Za-z0-9][A-Za-z0-9_-]*)\s' }
        container: "{db}"

  # Text: "Password <name> was successfully created in <db>/<branch>." then a
  # table with the plaintext password (the hook redacts it; only names are
  # read here). JSON: the API password object, including id and plain_text.
  - id: planetscale.cli.password_create
    kind: password
    role: created
    when: { tool: ^Bash$, command: ['\bpscale\s+password\s+create\b'] }
    extract:
      - from: output
        pattern: 'Password (?P<name>\S+) was successfully created in (?P<db>[A-Za-z0-9_-]+)/(?P<branch>[^\s.]+(?:\.[^\s.]+)*)\.'
        value: "{name}"
        container: "{db}/{branch}"
      - from: result
        value: "{result.id}"
        match: { value: "{password_id}" }

  # Text: "Role <name> was successfully created in <db>/<branch>." then the
  # credentials. JSON: the role object with id.
  - id: planetscale.cli.role_create
    kind: role
    role: created
    when: { tool: ^Bash$, command: ['\bpscale\s+role\s+create\b'] }
    extract:
      - from: output
        pattern: 'Role (?P<name>\S+) was successfully created in (?P<db>[A-Za-z0-9_-]+)/(?P<branch>[^\s.]+(?:\.[^\s.]+)*)\.'
        value: "{name}"
        container: "{db}/{branch}"
      - from: result
        value: "{result.id}"
        match: { value: "{role_id}" }

  # Text: "Deploy request #<n> successfully created.\n\nView this deploy
  # request in the browser: <html_url>". JSON: the API deploy request object.
  - id: planetscale.cli.deploy_request_create
    kind: deploy_request
    role: created
    when: { tool: ^Bash$, command: ['\bpscale\s+(?:deploy-request|dr)\s+create\b'] }
    extract:
      - from: output
        pattern: 'Deploy request #\d+ successfully created\.\s+View this deploy request in the browser: https://app\.planetscale\.com/[^/\s]+/(?P<db>[^/\s]+)/deploy-requests/(?P<number>\d+)'
        value: "{number}"
        container: "{db}"
      - from: output
        pattern: '"html_url"\s*:\s*"https://app\.planetscale\.com/[^/"]+/(?P<db>[^/"]+)/deploy-requests/(?P<number>\d+)"'
        value: "{number}"
        container: "{db}"

  # ---- Raw API: curl against api.planetscale.com, or `pscale api`. ----
  # Errors come back as {"code": "...", "message": "..."}.
  - id: planetscale.api.create_database
    kind: database
    role: created
    when:
      tool: ^Bash$
      command:
        - '(?:\bcurl\b[^|;&]*\bapi\.planetscale\.com/v1/|\bpscale\s+api\b[^|;&]*?[\s''"]/?)organizations/[^/?#\s''"]+/databases(?:[?#''"\s]|$)'
        - '(?:-X\s*POST\b|--request[=\s]+POST\b|--method[=\s]+POST\b|\s-d[\s''"@]|\s--data(?:-raw|-binary|-urlencode)?[=\s]|\s--json[=\s]|\s-F\s|\s--field[=\s]|\s--input[=\s])'
      not_command: ['(?:-X\s*|--request[=\s]+|--method[=\s]+)(?:GET|PATCH|PUT|DELETE)\b']
      result_has: [id]
      result_lacks: [code]
    extract:
      - from: result
        value: "{result.name}"
        capture:
          - { from: command, pattern: 'organizations/(?P<org>[^/?#\s''"]+)/databases' }
        container: "{org}"

  - id: planetscale.api.create_branch
    kind: branch
    role: created
    when:
      tool: ^Bash$
      command:
        - '(?:\bcurl\b[^|;&]*\bapi\.planetscale\.com/v1/|\bpscale\s+api\b[^|;&]*?[\s''"]/?)organizations/[^/?#\s''"]+/databases/[^/?#\s''"]+/branches(?:[?#''"\s]|$)'
        - '(?:-X\s*POST\b|--request[=\s]+POST\b|--method[=\s]+POST\b|\s-d[\s''"@]|\s--data(?:-raw|-binary|-urlencode)?[=\s]|\s--json[=\s]|\s-F\s|\s--field[=\s]|\s--input[=\s])'
      not_command: ['(?:-X\s*|--request[=\s]+|--method[=\s]+)(?:GET|PATCH|PUT|DELETE)\b']
      result_has: [id]
      result_lacks: [code]
    extract:
      - from: result
        value: "{result.name}"
        capture:
          - { from: command, pattern: 'organizations/[^/?#\s''"]+/databases/(?P<db>[^/?#\s''"]+)/branches' }
        container: "{db}"

  - id: planetscale.api.create_password
    kind: password
    role: created
    when:
      tool: ^Bash$
      command:
        - '(?:\bcurl\b[^|;&]*\bapi\.planetscale\.com/v1/|\bpscale\s+api\b[^|;&]*?[\s''"]/?)organizations/[^/?#\s''"]+/databases/[^/?#\s''"]+/branches/[^/?#\s''"]+/passwords(?:[?#''"\s]|$)'
        - '(?:-X\s*POST\b|--request[=\s]+POST\b|--method[=\s]+POST\b|\s-d[\s''"@]|\s--data(?:-raw|-binary|-urlencode)?[=\s]|\s--json[=\s]|\s-F\s|\s--field[=\s]|\s--input[=\s])'
      not_command: ['(?:-X\s*|--request[=\s]+|--method[=\s]+)(?:GET|PATCH|PUT|DELETE)\b']
      result_has: [id]
      result_lacks: [code]
    extract:
      - from: result
        value: "{result.id}"
        match: { value: "{password_id}" }

  - id: planetscale.api.create_role
    kind: role
    role: created
    when:
      tool: ^Bash$
      command:
        - '(?:\bcurl\b[^|;&]*\bapi\.planetscale\.com/v1/|\bpscale\s+api\b[^|;&]*?[\s''"]/?)organizations/[^/?#\s''"]+/databases/[^/?#\s''"]+/branches/[^/?#\s''"]+/roles(?:[?#''"\s]|$)'
        - '(?:-X\s*POST\b|--request[=\s]+POST\b|--method[=\s]+POST\b|\s-d[\s''"@]|\s--data(?:-raw|-binary|-urlencode)?[=\s]|\s--json[=\s]|\s-F\s|\s--field[=\s]|\s--input[=\s])'
      not_command: ['(?:-X\s*|--request[=\s]+|--method[=\s]+)(?:GET|PATCH|PUT|DELETE)\b']
      result_has: [id]
      result_lacks: [code]
    extract:
      - from: result
        value: "{result.id}"
        match: { value: "{role_id}" }

  - id: planetscale.api.create_deploy_request
    kind: deploy_request
    role: created
    when:
      tool: ^Bash$
      command:
        - '(?:\bcurl\b[^|;&]*\bapi\.planetscale\.com/v1/|\bpscale\s+api\b[^|;&]*?[\s''"]/?)organizations/[^/?#\s''"]+/databases/[^/?#\s''"]+/deploy-requests(?:[?#''"\s]|$)'
        - '(?:-X\s*POST\b|--request[=\s]+POST\b|--method[=\s]+POST\b|\s-d[\s''"@]|\s--data(?:-raw|-binary|-urlencode)?[=\s]|\s--json[=\s]|\s-F\s|\s--field[=\s]|\s--input[=\s])'
      not_command: ['(?:-X\s*|--request[=\s]+|--method[=\s]+)(?:GET|PATCH|PUT|DELETE)\b']
      result_has: [id]
      result_lacks: [code]
    extract:
      - from: result
        value: "{result.number}"
        capture:
          - { from: command, pattern: 'organizations/[^/?#\s''"]+/databases/(?P<db>[^/?#\s''"]+)/deploy-requests' }
        container: "{db}"

  # ---- Stripe Projects: `stripe projects add planetscale/postgresql|mysql`.
  # The output format is not documented; ids are taken only if it prints the
  # database's dashboard URL (the API's html_url shape). ----
  - id: planetscale.stripe_projects.add
    kind: database
    role: created
    when: { tool: ^Bash$, command: ['\bstripe\s+projects\s+add\s+planetscale/(?:postgresql|mysql)\b'] }
    extract:
      - from: output
        pattern: 'https://app\.planetscale\.com/(?P<org>[A-Za-z0-9_-]+)/(?P<db>[A-Za-z0-9_-]+)(?:[\s"''/]|$)'
        value: "{db}"
        container: "{org}"

coverage:
  - { kind: database, status: full, note: "GET /v1/organizations/{organization}/databases (Vitess, Postgres and Neki)" }
  - { kind: branch, status: full, note: "GET .../databases/{database}/branches (every engine; kind stored as engine)" }
  - { kind: password, status: full, note: "GET .../branches/{branch}/passwords (only for branches with kind = mysql); plain_text stripped" }
  - { kind: role, status: full, note: "GET .../branches/{branch}/roles (only for branches with kind = postgresql or neki); password and connection strings stripped" }
  - { kind: deploy_request, status: full, note: "GET .../databases/{database}/deploy-requests (only for databases with kind = mysql)" }
  - { kind: ip_restriction, status: planned, note: "GET .../databases/{database}/cidrs (Postgres database-level IP allowlist). A rule needs 'no entries' per database, which the engine cannot express yet." }
  - { kind: backup, status: planned, note: "GET .../branches/{branch}/backups. Inventory only, no exposure field, one extra call per branch." }
  - { kind: service_token, status: planned, note: "GET /v1/organizations/{organization}/service-tokens needs read_service_tokens; left out to keep the token narrow." }
  - { kind: bouncer, status: planned, note: "GET .../branches/{branch}/bouncers (Postgres PgBouncer). Inventory only." }
  - { kind: read_replica, status: planned, note: "GET .../branches/{branch}/dedicated-read-replicas. Inventory only." }
  - { kind: webhook, status: planned, note: "GET .../databases/{database}/webhooks returns the signing secret; would need strip data[].secret and a review. Never called today." }

recorder:
  pseudonymize: [id, name, branch, into_branch, parent_branch, database_branch.name, html_url, url, username]
  keep: [main, mysql, postgresql, neki, admin, reader, writer, readwriter, postgres, pg_read_all_data, pg_write_all_data]
