    - { kind: supabase.bucket, value: customer-files, container: abcdefghijklmnopqrst, role: created }

# Proof of creation: the SQL is
# lexed first, and statements that succeed whether or not the thing existed
# only reference it.
- name: CLI db query CREATE TABLE IF NOT EXISTS only references the table
  tool: Bash
  input: { command: "supabase db query \"CREATE TABLE IF NOT EXISTS public.users (id int)\" --project-ref abcdefghijklmnopqrst" }
  output: '{"boundary":"x","rows":[]}'
  expect:
    - { kind: supabase.table, value: public.users, container: abcdefghijklmnopqrst, role: referenced }

- name: CLI db query with create table only in a line comment
  tool: Bash
  input: { command: "supabase db query \"select count(*) from users -- create table users later\" --project-ref abcdefghijklmnopqrst" }
  output: "count\n42\n"
  expect: []

- name: CLI db query with create table only in a string constant
  tool: Bash
  input: { command: "supabase db query \"select 'create table users'\" --project-ref abcdefghijklmnopqrst" }
  output: "?column?\ncreate table users\n"
  expect: []

- name: CLI db query with create table in a block comment, E-string and dollar quote
  tool: Bash
  input: { command: 'supabase db query "select /* create table a */ 1, E''x\\'' create table b'', \$\$ create table c \$\$, \$f\$ create table d \$f\$" --project-ref abcdefghijklmnopqrst' }
  output: "ok"
  expect: []

- name: CLI db query with create table in a quoted identifier
