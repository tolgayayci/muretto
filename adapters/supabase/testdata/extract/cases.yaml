- name: CLI db query with --project-ref creates a table and a bucket
  tool: Bash
  input: { command: "supabase db query \"CREATE TABLE public.customers (id int); insert into storage.buckets (id, name, public) values ('customer-files', 'customer-files', true);\" --project-ref abcdefghijklmnopqrst" }
