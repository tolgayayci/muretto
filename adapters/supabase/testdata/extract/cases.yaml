# Extract cases built from the CLI/MCP output documented in
# Supabase's documentation. All ids are fakes. `expect` is the exact
# set of identifiers (kind, value, container, role); [] means none.

- name: CLI projects create (text mode)
  tool: Bash
  input: { command: "supabase projects create waitlist-demo --org-id example-org --db-password [REDACTED] --region eu-central-1" }
  output: |
    Creating project:    waitlist-demo
    Selected org-id:     example-org
    Selected region:     eu-central-1
    Created a new project at https://supabase.com/dashboard/project/abcdefghijklmnopqrst

       ORG ID      | REFERENCE ID         | NAME          | REGION                   | CREATED AT (UTC)
      -------------|----------------------|---------------|--------------------------|---------------------
       example-org | abcdefghijklmnopqrst | waitlist-demo | Central EU (Frankfurt)   | 2026-10-26 10:00:00
  expect:
    - { kind: supabase.project, value: abcdefghijklmnopqrst, role: created }

- name: CLI projects create with ANSI colours
  tool: Bash
  input: { command: "npx supabase projects create waitlist-demo --org-id example-org" }
  output: "\e[32mCreated a new project at https://supabase.com/dashboard/project/abcdefghijklmnopqrst\e[0m\n"
  expect:
    - { kind: supabase.project, value: abcdefghijklmnopqrst, role: created }

- name: CLI projects create that failed
