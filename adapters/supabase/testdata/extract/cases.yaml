  input: { command: "supabase db query 'select 1 as \"create table users\"' --project-ref abcdefghijklmnopqrst" }
  output: "ok"
  expect: []

- name: CLI db query with doubled quotes hiding a create table
  tool: Bash
  input: { command: "supabase db query \"select 'it''s; create table users'\" --project-ref abcdefghijklmnopqrst" }
  output: "ok"
