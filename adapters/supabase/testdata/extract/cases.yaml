- name: MCP apply_migration creates tables and a bucket
  tool: mcp__supabase__apply_migration
  input:
    project_id: abcdefghijklmnopqrst
    name: create_customers
    query: |
      CREATE TABLE IF NOT EXISTS public.customers (id bigint primary key, email text);
      create table "Orders" (id int);
      create table private.audit_log (id int);
      insert into storage.buckets (id, name, public) values ('customer-files', 'customer-files', false);
  output: '{"success":true}'
  expect:
    - { kind: supabase.table, value: public.customers, container: abcdefghijklmnopqrst, role: referenced }
    - { kind: supabase.table, value: public.Orders, container: abcdefghijklmnopqrst, role: created }
    - { kind: supabase.table, value: private.audit_log, container: abcdefghijklmnopqrst, role: created }
    - { kind: supabase.bucket, value: customer-files, container: abcdefghijklmnopqrst, role: created }

# A server pinned with ?project_ref=<ref> takes no project_id; the hook
# records the ref as mcp.project_ref.
- name: MCP apply_migration on a project-pinned server
  tool: mcp__supabase__apply_migration
  mcp: { project_ref: abcdefghijklmnopqrst }
  input: { name: create_customers_table, query: "create table public.customers (id int); insert into public.customers values (1);" }
  output: '{"success":true}'
  expect:
    - { kind: supabase.table, value: public.customers, container: abcdefghijklmnopqrst, role: created }

- name: MCP execute_sql bucket on a project-pinned server
  tool: mcp__supabase__execute_sql
  mcp: { project_ref: abcdefghijklmnopqrst }
  input: { query: "insert into storage.buckets (id, name, public) values ('demo-uploads','demo-uploads',true);" }
  output: '{"result":"Below is the result of the SQL query. <untrusted-data-00000000>\n[]\n</untrusted-data-00000000>"}'
  expect:
    - { kind: supabase.bucket, value: demo-uploads, container: abcdefghijklmnopqrst, role: created }

