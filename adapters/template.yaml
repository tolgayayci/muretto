# Template adapter: copy to adapters/<provider>.yaml and edit.
# Full walkthrough: docs/WRITING_AN_ADAPTER.md. Files whose name starts with
# "template" are not loaded, but this one must stay valid (a test checks it).
#
# Ground rules:
# - Read-only. Only GET endpoints you list here can ever be called. POST is
#   possible only with a body pinned in Go (internal/broker/pinned.go).
# - Never invent an endpoint, field or output string: cite the provider docs.
# - Attributes are an explicit allowlist. Nothing else from a response is kept.

format: 1                      # adapter format version
provider: example              # slug: ^[a-z][a-z0-9-]{1,31}$; resource kinds become example.<kind>
display_name: Example Cloud

api:
  base_url: https://api.example.com          # https, host only
  auth: { header: Authorization, scheme: Bearer }   # sends "Authorization: Bearer <token>"

# MCP server names (as in mcp__<server>__<tool>). Matching is case-insensitive
# and also accepts mcp__claude_ai_<Name>__x and mcp__plugin_<p>_<name>__x.
mcp_servers: [example]

# Shown by `muretto init`: the least-privilege token to create, step by step.
token_help: |
  Create a read-only API token in Example Cloud: Settings > Tokens > New,
  permissions "Projects: read" and "Databases: read".

# Opt-in features a user turns on per account (Credentials.Options).
options:
  - name: extra_detail
    description: "Also read per-database settings (needs the Settings read permission)."

# Every endpoint the adapter may call. This IS the broker allowlist.
#   method:      GET (default) or POST with pinned_body
#   path:        {var} matches one path segment; each var needs a params entry
#   params:      templates for path vars (context: the parent item, see kinds)
#   query:       allowed query names and their value templates; a param whose
#                template has no value is simply not sent
#   pagination:  next = JSON path of the cursor in the response; param = query
#                name to send it in; max_pages (default 50) guards loops
#   strip:       JSON paths removed by the broker before anything sees the body
#                ("items[].secret"); keys like value, jwt_secret, db_pass are
#                always stripped in Go
#   on_status:   { 422: empty } treats that status as "zero items"
endpoints:
  orgs:
    path: /v1/orgs
  projects:
    path: /v1/projects
    query: { org: "{account}", per_page: "100" }
    pagination: { next: meta.next_cursor, param: cursor }
    strip: ["projects[].connection_string"]
  databases:
    path: /v1/projects/{project}/databases
    params: { project: "{parent.id}" }
    on_status: { 404: empty }
  database_settings:
    path: /v1/databases/{db}/settings
    params: { db: "{id}" }

# How to list the accounts (orgs/teams) a token can see.
accounts:
  endpoint: orgs
  items: orgs          # JSON path to the array ("$" = the body itself)
  id: "{id}"           # templates over one item
  name: "{name}"

# Templates: literal text with {path|filter} placeholders. Paths are dotted
# JSON paths into the current item; "parent." reaches the for_each parent and
# "account" is the account id. Filters: or:<path>, default:<text>, lower,
# upper, trim, join (sorted, comma-joined array), unquote, pg_ident,
# sql_ident, sql_literal. A template whose placeholder has no value renders
# nothing (an item without an id is skipped and the check reports it).
kinds:
  - kind: project                       # resource kind example.project
    sources:
      - endpoint: projects
        items: projects                 # or a list of alternatives: [items, $]
        # where: predicate over the item; items that are not true are dropped
        where: { not: { field: deleted, equals: "true" } }
        id: "{id}"                      # provider_id; resource id = example.project:<id>
        name: "{name}"
        status: "{state|lower}"
        url: "https://console.example.com/projects/{id}"
        created_at: { value: "{created_at}", format: auto }  # rfc3339 | epoch_ms | epoch_s | auto
        attributes:                     # the explicit allowlist
          - region                      # copies item.region as "region"
          - { name: plan, field: billing.plan }   # rename / nested field
          - { name: public_api, field: settings.public_api, default: false }
    match: { value: "{provider_id}" }   # how identifiers find this resource
    remove:                             # printed by `muretto fix`, never run
      kind: command                     # sql | command | steps
      text: "example projects delete {provider_id}"

  - kind: database
    for_each: project                   # one call per project; parent = that project
    sources:
      - endpoint: databases
        items: databases
        checks_rules: [public_database] # this call's check also counts for the rule
        # seen_via: advisor             # for sources that only list flagged items
        # requires_option: extra_detail # source only runs when the option is on
        # unavailable_if: predicate     # any matching item marks the check as error
        id: "{parent.id}/{name}"
        name: "{name}"
        created_at: { value: "{created_at}", format: rfc3339 }
        attributes:
          - { name: public, field: public_access }
          - { name: project_id, template: "{parent.id}" }
    enrich:                             # optional extra GET per resource
      - endpoint: database_settings
        requires_option: extra_detail
        attributes: [ssl_enforced]
    match: { value: "{provider_id}" }

# Exposure rules. Predicates (three-valued: a missing field is "unknown"):
#   all: [..] | any: [..] | not: p |
#   field: <path> with one of present, is_null, equals, in, prefix_any,
#   matches (RE2), contains_any, in_field
# Rules see the resource's attributes, core fields (provider_id, name, ...) and
# parent.<attribute> during a scan.
#   applies:     the rule only runs where this is true (default: always)
#   exposed:     true => exposed
#   not_exposed: true => not_exposed (default: exposed is false)
#   otherwise    unknown
rules:
  - id: public_database
    kind: database
    severity: high                      # critical | high | medium | low | info
    signal: api_field                   # official_advisor | api_field | catalog_query | name_pattern
    exposed: { field: public, equals: "true" }
    title: "Public database: {name}"
    explanation: Database {name} accepts connections from the internet.
    caveat: Firewall rules outside Example Cloud are not visible to the API.
    fix:
      kind: steps
      text: "Console > {name} > Networking > turn off Public access."
      docs_url: https://docs.example.com/networking

# Signatures find resource ids in agent tool calls (pure; no network).
#   when:    tool (regex on the tool name) with optional command (regexes that
#            must all match Bash input.command), not_command, input_matches,
#            output; or mcp_tools (+ mcp_server, default mcp_servers).
#            status: ok (default) or any. result_lacks: skip if the JSON result
#            has these top-level keys (e.g. error). result_has: skip unless
#            the result is a JSON object with one of these keys (e.g. success).
#   role:    created (the call made it) or referenced (the id only appeared)
#   extract: from output | command | input.<path> with a regex (named groups
#            become template fields), or from result | input with templates
#            (each: path to an array; each element is "item").
#            split: { field, sep } turns one group into several ids.
#            capture: extra regexes whose groups join the context.
#            container: where the value is unique (e.g. the project).
#            match: override the kind's match rule for these identifiers.
#            preprocess: [shell_args, sql] rewrites the text before the
#            regex runs (sql drops comments and hides string contents).
#            referenced_if: <group> makes a match referenced when that group
#            matched (e.g. CREATE TABLE IF NOT EXISTS proves nothing).
signatures:
  - id: example.cli.projects_create
    kind: project
    role: created
    when: { tool: ^Bash$, command: ['\bexample\s+projects\s+create\b'] }
    extract:
      - from: output
        pattern: 'Created project (?P<id>proj_[a-z0-9]+)'
        value: "{id}"
  - id: example.mcp.create_database
    kind: database
    role: created
    when: { mcp_tools: [create_database], result_lacks: [error] }
    extract:
      - { from: result, value: "{input.project_id}/{result.name}", container: "{input.project_id}" }

# `muretto providers --coverage`: every kind the provider has, honestly.
coverage:
  - { kind: project, status: full, note: "GET /v1/projects" }
  - { kind: database, status: full, note: "GET /v1/projects/{id}/databases" }
  - { kind: bucket, status: planned, note: "No read endpoint yet" }

# Keys whose values the opt-in recorder replaces with stable fakes.
recorder:
  pseudonymize: [id, name, region]
