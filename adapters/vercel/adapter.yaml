# Vercel adapter. Every endpoint, field and output string here comes from
# adapters/vercel/research.md (checked 2026-10-26). Format: adapters/WRITING.md.
format: 1
provider: vercel
display_name: Vercel

api:
  base_url: https://api.vercel.com
  auth: { header: Authorization, scheme: Bearer }

mcp_servers: [vercel]

token_help: |
  Create a team-scoped access token: vercel.com/account/tokens > Create,
  Scope: your team (All Projects), with a short expiration, named e.g.
  muretto-readonly. Vercel has no read-only token: this token can read AND
  write everything in that team. Muretto only ever sends allowlisted GET
  requests, enforced in code (internal/broker), and never asks for env values.
  A project-scoped token is narrower but hides team-level domains.

# The broker allowlist is built from exactly these endpoints. `decrypt` is never
# allowed (the broker refuses it in Go too), and the env list may only carry
# teamId.
endpoints:
  teams:
    path: /v2/teams
  projects:
    path: /v10/projects
    query: { teamId: "{account}", limit: "100" }
    pagination: { next: pagination.next, param: until } # string `next` param unverified
    strip: ["projects[].env", "projects[].protectionBypass", "projects[].link.deployHooks", "projects[].latestDeployments[].meta"]
  deployments:
    path: /v7/deployments
    query: { teamId: "{account}", projectId: "{parent.id}", limit: "100" }
    pagination: { next: pagination.next, param: until }
    strip: ["deployments[].env"]
  domains:
    path: /v5/domains
    query: { teamId: "{account}", limit: "100" }
    pagination: { next: pagination.next, param: until }
  project_domains:
    path: /v9/projects/{idOrName}/domains
    params: { idOrName: "{parent.id}" }
    query: { teamId: "{account}", limit: "100" }
    pagination: { next: pagination.next, param: until }
  project_env:
    path: /v10/projects/{idOrName}/env
    params: { idOrName: "{parent.id}" }
    query: { teamId: "{account}" }
    strip: ["envs[].value", "envs[].vsmValue", "envs[].legacyValue", value, vsmValue, legacyValue]

accounts:
  endpoint: teams
  items: teams
  id: "{id}"
  name: "{name}"
  slug: "{slug}" # pass as Credentials.AccountSlug; the CLI prints team slugs

kinds:
  - kind: project
    sources:
      - endpoint: projects
        items: projects
        id: "{id}"
        name: "{name}"
        created_at: { value: "{createdAt}", format: epoch_ms }
        attributes:
          - framework
          - paused
          # Protection inputs for public_preview: null = off, absent = unknown.
          - { name: sso_protection, field: ssoProtection.deploymentType }
          - { name: password_protection, field: passwordProtection.deploymentType }
          - { name: trusted_ips, field: trustedIps.deploymentType }
          - { name: link_type, field: link.type }
          - { name: link_repo, field: link.repo }
          - { name: creator_type, field: creator.type }
    match: { value: "{provider_id}" }

  - kind: deployment
    for_each: project
    sources:
      - endpoint: deployments
        items: deployments
        checks_rules: [public_preview]
        id: "{uid}"
        name: "{url|or:uid}"
        status: "{readyState|or:state|lower}"
        url: "https://{url}"
        created_at: { value: "{createdAt|or:created}", format: epoch_ms }
        attributes:
          - target # null = preview
          - source
          - { name: host, field: url }
          - { name: project_id, field: projectId }
          - { name: custom_environment, field: customEnvironment.slug }
          - { name: inspector_url, field: inspectorUrl }
          - { name: creator_type, field: creator.type }
    match: { value: "{provider_id}" }

  - kind: domain
    sources:
      - endpoint: domains
        items: domains
        id: "{name}"
        name: "{name}"
        created_at: { value: "{createdAt}", format: epoch_ms }
        attributes:
          - verified
          - { name: service_type, field: serviceType }
    match: { value: "{provider_id}", container: "{account_slug}" }

  - kind: project_domain
    for_each: project
    sources:
      - endpoint: project_domains
        items: domains
        id: "{projectId|or:parent.id}/{name}"
        name: "{name}"
        created_at: { value: "{createdAt}", format: epoch_ms }
        attributes:
          - verified
          - redirect
          - { name: domain, field: name }
          - { name: apex_name, field: apexName }
          - { name: git_branch, field: gitBranch }
          - { name: project_id, template: "{projectId|or:parent.id}" }

  - kind: env_var
    for_each: project
    sources:
      - endpoint: project_env
        items: [envs, $]
        checks_rules: [client_exposed_env]
        id: "{parent.id}/{key}/{target|join}"
        name: "{key}"
        created_at: { value: "{createdAt}", format: epoch_ms }
        attributes: # names and metadata only; values are stripped by the broker
          - key
          - type
          - visibility
          - { name: env_id, field: id }
          - { name: targets, template: "{target|join}" }
          - { name: git_branch, field: gitBranch }
          - { name: content_hint, field: contentHint.type }
          - { name: security_issues, field: securityIssues, default: "" }
          - { name: project_id, template: "{parent.id}" }
          - { name: project_name, template: "{parent.name}" }
    match: { value: "{env_id}" }

rules:
  - id: public_preview
    kind: deployment
    severity: high
    signal: api_field
    # Vercel's own CLI rule (getProtectionForDeployment): a non-production
    # deployment is protected by any enabled method.
    applies: { not: { field: target, equals: production } }
    exposed:
      all:
        - { field: parent.sso_protection, is_null: true }
        - { field: parent.password_protection, is_null: true }
        - any:
            - { field: parent.trusted_ips, is_null: true }
            - { field: parent.trusted_ips, equals: production }
            # Vercel omits trustedIps when it is not configured (seen live
            # 2026-10-27), while the two fields above come back as explicit
            # nulls, so they prove the protection fields were returned.
            - { field: parent.trusted_ips, present: false }
    title: "Public preview: {host|or:provider_id}"
    explanation: >-
      This preview deployment's project has Vercel Authentication, Password
      Protection and Trusted IPs all off for previews, so anyone with the URL
      can open it and call its functions.
    caveat: >-
      Decided from project protection settings. Protection exceptions,
      shareable links and bypass secrets are not visible to the API.

  - id: client_exposed_env
    kind: env_var
    severity: high
    signal: name_pattern
    exposed:
      any:
        - all:
            # Vercel CLI's API_PUBLIC_PREFIXES plus framework envPrefix values.
            - field: key
              prefix_any: [NEXT_PUBLIC_, VUE_APP_, REACT_APP_, GATSBY_, GRIDSOME_, NUXT_PUBLIC_, NUXT_ENV_, STORYBOOK_, VITE_, PUBLIC_, EXPO_PUBLIC_, NG_APP_, REDWOOD_ENV_, SANITY_STUDIO_]
            - { field: key, matches: '(SECRET|PRIVATE|SERVICE_ROLE|PASSWORD|TOKEN|API_KEY|KEY$)' }
            # Keys designed to be public (Supabase anon/publishable, Stripe publishable).
            - { not: { field: key, matches: '(PUBLISHABLE|ANON)_KEY$' } }
        - { field: security_issues, contains_any: [readable-secret] }
    title: "Secret-looking env var exposed to the browser: {key}"
    explanation: >-
      {key} has a public framework prefix, so its value is bundled into
      client-side code that anyone visiting the site can read, and its name
      suggests a secret (or Vercel flagged it as a readable secret). Muretto
      never reads the value.

signatures:
  # ---- Vercel CLI. In Claude Code the CLI detects the agent and prints JSON. ----
  - id: vercel.cli.deploy
    kind: deployment
    role: created
    when:
      tool: ^Bash$
      command: ['(?m)\bvercel(?:@[\w.-]+)?(?:\s+(?:deploy|redeploy)\b|(?:\s+--?[A-Za-z][\w-]*(?:=\S+)?)*\s*(?:$|&&|;|\|))']
    extract:
      - from: output
        pattern: '"id"\s*:\s*"(?P<id>dpl_[A-Za-z0-9]+)"'
        value: "{id}"
      - from: output
        pattern: '/v13/deployments/(?P<id>dpl_[A-Za-z0-9]+)'
        value: "{id}"
      - from: output # human-mode labels or bare stdout URL: match by host
        pattern: '(?m)^(?:▲|\s)?\s*(?:(?:Preview|Production)\s+)?https://(?P<host>[a-z0-9-]+\.vercel\.app)\s*$'
        value: "{host}"
        match: { value: "{host}" }
      - from: output # JSON envelope: deployment.url (not productionUrl)
        pattern: '"url"\s*:\s*"https://(?P<host>[a-z0-9-]+\.vercel\.app)"'
        value: "{host}"
        match: { value: "{host}" }
      - from: output # the envelope's "next" hints name the new deployment; they
        # survive `| tail`, which agents often add (seen live 2026-10-27)
        pattern: '"command"\s*:\s*"vercel (?:curl|inspect) (?:https://)?(?P<host>[a-z0-9-]+\.vercel\.app)\b'
        value: "{host}"
        match: { value: "{host}" }

  # The first `vercel deploy --yes` in a directory creates the project and
  # prints "✓ Created <team>/<project>" (CLI 65, seen live 2026-10-27); linking
  # an existing project prints "Linked" instead, so this line is proof.
  - id: vercel.cli.deploy_new_project
    kind: project
    role: created
    when:
      tool: ^Bash$
      command: ['(?m)\bvercel(?:@[\w.-]+)?(?:\s+(?:deploy|redeploy)\b|(?:\s+--?[A-Za-z][\w-]*(?:=\S+)?)*\s*(?:$|&&|;|\|))']
    extract:
      - from: output
        pattern: '(?m)^\s*✓\s+Created\s+(?P<team>[a-z0-9-]+)/(?P<name>[a-z0-9._-]+)\s*$'
        value: "{name}"
        container: "{team}"
        match: { value: "{name}", container: "{account_slug}" }

  - id: vercel.cli.project_create
    kind: project
    role: created
    when: { tool: ^Bash$, command: ['\bvercel(?:@[\w.-]+)?\s+projects?\s+(?:create|add)\b'] }
    extract:
      - from: output # prints name and team only, never the prj_ id
        pattern: 'Success!\s+Project\s+(?P<name>\S+)\s+added\s+\((?P<team>[^)\s]+)\)'
        value: "{name}"
        container: "{team}"
        match: { value: "{name}", container: "{account_slug}" }

  - id: vercel.cli.env_add
    kind: env_var
    role: created
    when: { tool: ^Bash$, command: ['\bvercel(?:@[\w.-]+)?\s+env\s+add\b'] }
    extract:
      - from: output # never the command line: it may carry --value
        pattern: '(?m)^(?:✓\s+)?\s*(?:Added|Overrode)\s+(?P<key>[A-Z_][A-Z0-9_]*)\s*$'
        capture: [{ from: output, pattern: '(?m)^\s+Project\s+(?P<team>[a-z0-9-]+)/(?P<project>[a-z0-9._-]+)\s*$' }]
        value: "{key}"
        container: "{project}" # project name; the team is not part of the match
        match: { value: "{key}", container: "{project_name}" }

  - id: vercel.cli.domains_add
    kind: domain
    role: created
    when: { tool: ^Bash$, command: ['\bvercel(?:@[\w.-]+)?\s+domains\s+add\b'] }
    extract:
      - from: output
        pattern: '"reason"\s*:\s*"domain_added"[\s\S]*?"message"\s*:\s*"Domain (?P<domain>\S+) added to (?P<team>[a-z0-9-]+)\.'
        value: "{domain}"
        container: "{team}"
      - from: output
        pattern: 'Success! Domain (?P<domain>\S+) added to (?P<team>[a-z0-9-]+)\.'
        value: "{domain}"
        container: "{team}"

  # Any Bash output that shows a project id (e.g. cat .vercel/project.json).
  - id: vercel.cli.project_id_seen
    kind: project
    role: referenced
    when: { tool: ^Bash$ }
    extract:
      - from: output
        pattern: '"projectId"\s*:\s*"(?P<id>prj_[A-Za-z0-9]+)"'
        value: "{id}"

  # ---- Stripe Projects: a known creation path. Ids only if printed. ----
  - id: vercel.stripe_projects.add
    kind: project
    role: created
    when: { tool: ^Bash$, command: ['\bstripe\s+projects\s+add\s+vercel/'] }
    extract:
      - from: output
        pattern: '\b(?P<id>prj_[A-Za-z0-9]+)\b'
        value: "{id}"
      - kind: deployment
        from: output
        pattern: '\b(?P<id>dpl_[A-Za-z0-9]+)\b'
        value: "{id}"

  # ---- Vercel MCP (mcp.vercel.com). Result shapes mirror the REST create
  # responses; unverified until a real transcript is captured. ----
  - id: vercel.mcp.create_project
    kind: project
    role: created
    when: { mcp_tools: [create_project], result_lacks: [error] }
    extract:
      - { from: result, value: "{result.id}" }

  - id: vercel.mcp.deploy
    kind: deployment
    role: created
    when: { mcp_tools: [deploy_to_vercel, create_deployment, create_git_project], result_lacks: [error] }
    extract:
      - from: output
        pattern: '\b(?P<id>dpl_[A-Za-z0-9]+)\b'
        value: "{id}"
      - kind: project
        from: output
        pattern: '\b(?P<id>prj_[A-Za-z0-9]+)\b'
        value: "{id}"

  - id: vercel.mcp.create_project_env
    kind: env_var
    role: created
    when: { mcp_tools: [create_project_env], result_lacks: [error] }
    extract:
      # Value = key, container = the project the call named (input idOrName,
      # mirroring the REST path parameter; unverified for MCP).
      - from: result
        each: result.created
        value: "{item.key}"
        container: "{input.idOrName|or:input.projectId}"
        match: { value: "{key}", container: "{project_id}" }

  - id: vercel.mcp.add_project_domain
    kind: project_domain
    role: created
    when: { mcp_tools: [add_project_domain], result_lacks: [error] }
    extract:
      - { from: result, value: "{result.projectId}/{result.name}" }

  # Every other Vercel MCP call: ids that appear were only read.
  - id: vercel.mcp.read
    kind: deployment
    role: referenced
    when: { mcp_tools: ["*"] }
    extract:
      - from: output
        pattern: '\b(?P<id>dpl_[A-Za-z0-9]+)\b'
        value: "{id}"
      - kind: project
        from: output
        pattern: '\b(?P<id>prj_[A-Za-z0-9]+)\b'
        value: "{id}"

coverage:
  - { kind: project, status: full, note: "GET /v10/projects" }
  - { kind: deployment, status: full, note: "GET /v7/deployments per project; preview URL and target" }
  - { kind: domain, status: full, note: "GET /v5/domains" }
  - { kind: project_domain, status: full, note: "GET /v9/projects/{id}/domains" }
  - { kind: env_var, status: full, note: "Names only; values are stripped before storage" }
  - { kind: alias, status: planned, note: "GET /v4/aliases" }
  - { kind: custom_environment, status: planned, note: "GET /v9/projects/{id}/custom-environments" }
  - { kind: global_config, status: planned, note: "GET /v1/global-config (formerly Edge Config)" }
  - { kind: sandbox, status: planned, note: "GET /v2/sandboxes" }
  - { kind: webhook, status: planned, note: "GET /v1/webhooks" }
  - { kind: drain, status: planned, note: "GET /v1/drains" }
  - { kind: blob_store, status: planned, note: "Blocked: no documented list endpoint" }
  - { kind: temporary_deployment, status: planned, note: "Blocked: not in any account (vercel deploy --temporary)" }

recorder:
  pseudonymize: [id, uid, name, url, host, accountId, projectId, teamId, userId, username, email, githubLogin, org, repo, repoId, createdBy, updatedBy, inspectorUrl, apexName, slug, githubCommitSha, githubCommitRef, configurationId, storeId]
  keep: [vercel.app, production, preview, development]
