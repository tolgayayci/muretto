# Extract cases built from the CLI/MCP output documented in
# adapters/vercel/research.md (Q5, Q6). All ids are fakes. MCP result shapes are
# unverified upstream; these follow the REST create responses as the research
# recommends.

- name: vercel deploy in agent mode (JSON envelope on stdout, hints on stderr)
  tool: Bash
  input: { command: "vercel deploy --yes" }
  output: |
    <claude-code-hint v="1" type="plugin" value="vercel@claude-plugins-official" />
    {
      "status": "ok",
      "deployment": {
        "id": "dpl_EXAMPLE00000000000000000000",
        "url": "https://example-waitlist-abc123def-example-team.vercel.app",
        "productionUrl": null,
        "inspectorUrl": "https://vercel.com/example-team/example-waitlist/EXAMPLEdeploymentid00000",
        "readyState": "READY",
        "target": null,
        "deploymentApiUrl": "https://api.vercel.com/v13/deployments/dpl_EXAMPLE00000000000000000000"
      },
      "message": "Deployment example-waitlist-abc123def-example-team.vercel.app ready.",
      "next": [
        { "command": "vercel curl https://example-waitlist-abc123def-example-team.vercel.app", "when": "Verify deployment, including when Deployment Protection is enabled" },
        { "command": "vercel deploy --prod", "when": "Promote to production" }
      ]
    }
  expect:
    - { kind: vercel.deployment, value: dpl_EXAMPLE00000000000000000000, role: created }
    - { kind: vercel.deployment, value: example-waitlist-abc123def-example-team.vercel.app, role: created }

- name: first vercel deploy creates the project (CLI 65 non-TTY, live shape)
  tool: Bash
  input: { command: "cd example-landing && vercel deploy --yes --scope example-team" }
  output: |
    Vercel CLI 65.4.0

      No framework detected. Default Project Settings:
      Output Directory: `public` if it exists, or `.`

    ✓ Created         example-team/example-landing
      Inspect         https://vercel.com/example-team/example-landing/EXAMPLEdeploymentid00000
      Production      https://example-landing-abc123def-example-team.vercel.app
    ▲ Aliased         https://example-landing-five.vercel.app
    {
      "status": "ok",
      "deployment": {
        "id": "dpl_EXAMPLE00000000000000000009",
        "url": "https://example-landing-abc123def-example-team.vercel.app",
        "readyState": "READY",
        "target": "production",
        "deploymentProtection": []
      },
      "hint": "This is the project’s first deployment, so it was assigned to production."
    }
  expect:
    - { kind: vercel.deployment, value: dpl_EXAMPLE00000000000000000009, role: created }
    - { kind: vercel.deployment, value: example-landing-abc123def-example-team.vercel.app, role: created }
    - { kind: vercel.project, value: example-landing, container: example-team, role: created }

- name: vercel deploy piped through tail keeps only the next hints (live shape)
  tool: Bash
  input: { command: "cd example-waitlist && vercel deploy --yes --scope example-team 2>&1 | tail -15" }
  output: |2
      "next": [
        {
          "command": "vercel curl https://example-waitlist-abc123def-example-team.vercel.app",
          "when": "Verify deployment, including when Deployment Protection is enabled"
        },
        {
          "command": "vercel inspect example-waitlist-abc123def-example-team.vercel.app --scope example-team",
          "when": "Inspect deployment"
        },
        {
          "command": "vercel deploy --prod --scope example-team",
          "when": "Promote to production"
        }
      ]
    }
  expect:
    - { kind: vercel.deployment, value: example-waitlist-abc123def-example-team.vercel.app, role: created }

- name: vercel deploy into a linked project creates no project
  tool: Bash
  input: { command: "vercel deploy --yes" }
  output: |
    ✓ Linked to example-team/example-landing (created .vercel and added it to .gitignore)
      Inspect         https://vercel.com/example-team/example-landing/EXAMPLEdeploymentid00000
    {"status":"ok","deployment":{"id":"dpl_EXAMPLE00000000000000000010","target":null}}
  expect:
    - { kind: vercel.deployment, value: dpl_EXAMPLE00000000000000000010, role: created }

- name: bare vercel --prod in human mode (labels on stderr, URL on stdout)
  tool: Bash
  input: { command: "cd web && npx vercel --prod" }
  output: |2
      Inspect         https://vercel.com/example-team/example-waitlist/EXAMPLEdeploymentid00000
    ▲ Production      https://example-waitlist-abc123def-example-team.vercel.app
    ▲ Aliased         https://example-waitlist.vercel.app
    https://example-waitlist-abc123def-example-team.vercel.app
  expect:
    - { kind: vercel.deployment, value: example-waitlist-abc123def-example-team.vercel.app, role: created }

- name: vercel inspect is read-only
  tool: Bash
  input: { command: "vercel inspect example-waitlist-abc123def-example-team.vercel.app --json" }
  output: '{"id":"dpl_EXAMPLE00000000000000000000","url":"example-waitlist-abc123def-example-team.vercel.app"}'
  expect: []

- name: vercel project create prints name and team only
  tool: Bash
  input: { command: "vercel project create example-waitlist" }
  output: "> Success! Project example-waitlist added (example-team) [412ms]"
  expect:
    - { kind: vercel.project, value: example-waitlist, container: example-team, role: created }

- name: vercel env add (labels on stderr; command value redacted)
  tool: Bash
  input: { command: "vercel env add NEXT_PUBLIC_SUPABASE_URL production preview --value [REDACTED] --yes" }
  output: |
    ✓ Added           NEXT_PUBLIC_SUPABASE_URL
      Project         example-team/example-waitlist
      Environments    Production, Preview
      Type            Config
  expect:
    - { kind: vercel.env_var, value: NEXT_PUBLIC_SUPABASE_URL, container: example-waitlist, role: created }

- name: vercel domains add in agent mode
  tool: Bash
  input: { command: "vercel domains add example-waitlist.dev" }
  output: '{"status":"success","reason":"domain_added","message":"Domain example-waitlist.dev added to example-team.","next":[]}'
  expect:
    - { kind: vercel.domain, value: example-waitlist.dev, container: example-team, role: created }

- name: vercel domains add in human mode
  tool: Bash
  input: { command: "vercel domains add example-waitlist.dev" }
  output: "> Success! Domain example-waitlist.dev added to example-team. [1s]"
  expect:
    - { kind: vercel.domain, value: example-waitlist.dev, container: example-team, role: created }

- name: reading .vercel/project.json references the project
  tool: Bash
  input: { command: "cat .vercel/project.json" }
  output: '{"projectId":"prj_EXAMPLE000000000000000000","orgId":"team_EXAMPLE00000000000000","projectName":"example-waitlist"}'
  expect:
    - { kind: vercel.project, value: prj_EXAMPLE000000000000000000, role: referenced }

- name: Stripe Projects add vercel/project with an id in the output
  tool: Bash
  input: { command: "stripe projects add vercel/project --json" }
  output: '{"status":"ok","resource":{"provider":"vercel","backend_id":"prj_EXAMPLE000000000000000000"}}'
  expect:
    - { kind: vercel.project, value: prj_EXAMPLE000000000000000000, role: created }

- name: MCP deploy_to_vercel
  tool: mcp__vercel__deploy_to_vercel
  input: { name: example-waitlist, target: preview }
  output: '{"id":"dpl_EXAMPLE00000000000000000000","url":"example-waitlist-abc123def-example-team.vercel.app","projectId":"prj_EXAMPLE000000000000000000","readyState":"QUEUED"}'
  expect:
    - { kind: vercel.deployment, value: dpl_EXAMPLE00000000000000000000, role: created }
    - { kind: vercel.project, value: prj_EXAMPLE000000000000000000, role: created }

- name: MCP create_project via the claude.ai connector name
  tool: mcp__claude_ai_Vercel__create_project
  input: { name: example-waitlist }
  output: '{"id":"prj_EXAMPLE000000000000000000","name":"example-waitlist","accountId":"team_EXAMPLE00000000000000"}'
  expect:
    - { kind: vercel.project, value: prj_EXAMPLE000000000000000000, role: created }

- name: MCP create_project_env
  tool: mcp__vercel__create_project_env
  input: { idOrName: prj_EXAMPLE000000000000000000 }
  output: '{"created":[{"id":"EXAMPLEenvid0001","key":"NEXT_PUBLIC_SUPABASE_URL","target":["production"]}],"failed":[]}'
  expect:
    - { kind: vercel.env_var, value: NEXT_PUBLIC_SUPABASE_URL, container: prj_EXAMPLE000000000000000000, role: created }

- name: MCP add_project_domain
  tool: mcp__vercel__add_project_domain
  input: { idOrName: prj_EXAMPLE000000000000000000 }
  output: '{"name":"waitlist.example-waitlist.dev","apexName":"example-waitlist.dev","projectId":"prj_EXAMPLE000000000000000000","verified":false}'
  expect:
    - { kind: vercel.project_domain, value: prj_EXAMPLE000000000000000000/waitlist.example-waitlist.dev, role: created }
    - { kind: vercel.project, value: prj_EXAMPLE000000000000000000, role: referenced }

- name: MCP get_deployment references only
  tool: mcp__vercel__get_deployment
  input: { idOrUrl: dpl_EXAMPLE00000000000000000000 }
  output: '{"id":"dpl_EXAMPLE00000000000000000000","projectId":"prj_EXAMPLE000000000000000000","readyState":"READY"}'
  expect:
    - { kind: vercel.deployment, value: dpl_EXAMPLE00000000000000000000, role: referenced }
    - { kind: vercel.project, value: prj_EXAMPLE000000000000000000, role: referenced }

- name: MCP deploy that failed
  tool: mcp__vercel__deploy_to_vercel
  status: error
  input: { name: example-waitlist }
  output: "Error: build failed"
  expect: []
