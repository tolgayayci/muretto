# One workspace. Services: a free web service and a suspended static site.
# Postgres: open (0.0.0.0/0, free, already expired), restricted, six entries
# with 0.0.0.0/0 last (free without expiresAt), closed, and one with no
# ipAllowList whose free expiry is far off. Key Value: closed, open, and one
# whose ipAllowList is absent. Every list ends with an empty page asked for
# with the last item's cursor. Stripped fields hold MURETTO_FAKE_SECRET.
- { path: /v1/owners, query: { limit: "100" }, file: owners.json }
- { path: /v1/owners, query: { limit: "100", cursor: cursorOWNEREXAMPLE01 }, body: "[]" }
- { path: /v1/services, query: { ownerId: tea-example0000000000001, limit: "100" }, file: services.json }
- { path: /v1/services, query: { ownerId: tea-example0000000000001, limit: "100", cursor: cursorSRVEXAMPLE02 }, body: "[]" }
