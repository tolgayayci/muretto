# Neon adapter. Every endpoint, field and output string here comes from
# the provider's own documentation (checked 2026-11-01). Format: adapters/WRITING.md.
# Not yet verified live.
format: 1
provider: neon
display_name: Neon

api:
  base_url: https://console.neon.tech
  auth: { header: Authorization, scheme: Bearer }

# Neon's MCP server (mcp.neon.tech) and the claude.ai Neon connector.
mcp_servers: [neon]

token_help: |
  Neon has no read-only API key type. The narrowest working setup:
  1. In your Neon organization, invite a separate user (for example a
     muretto@ address you control) with the organization role Viewer:
     Organization > People > Invite, role Viewer.
  2. Sign in as that user and create a personal API key:
     profile menu > Account settings > API keys > Create new API key.
  A Viewer can read project, branch, compute, database and role metadata in
  every project of the organization, cannot see connection strings or run
  SQL, and cannot change existing projects. It can still create new projects
  of its own (and becomes Admin on them).
  Organization API keys are admin-level and project-scoped keys have Editor
  access (they can change the project): both work but can do much more.
  Muretto only ever sends GET requests to the endpoints in this file,
  enforced in code (internal/broker).

# The broker allowlist is built from exactly these endpoints. Never add:
# /projects/{id}/connection_uri, .../roles/{role}/reveal_password,
# .../credentials/{token}/reveal, .../realtime/secret, /api_keys
#.
endpoints:
  organizations:
    path: /api/v2/users/me/organizations
  projects:
    path: /api/v2/projects
    query: { org_id: "{account}", limit: "400" }
    # pagination.cursor marks the last item of every page, even the last one;
    # the official SDK stops on an empty page.
    pagination: { next: pagination.cursor, param: cursor, items: projects }
  project:
    path: /api/v2/projects/{project_id}
    params: { project_id: "{id}" }
    strip: [project.owner.email, project.owner.name]
  branches:
    path: /api/v2/projects/{project_id}/branches
    params: { project_id: "{parent.id}" }
    query: { limit: "1000" }
    pagination: { next: pagination.next, param: cursor, items: branches }
    strip: ["branches[].created_by"]
  endpoints:
    path: /api/v2/projects/{project_id}/branches/{branch_id}/endpoints
    params: { project_id: "{parent.project_id}", branch_id: "{parent.id}" }
  databases:
    path: /api/v2/projects/{project_id}/branches/{branch_id}/databases
    params: { project_id: "{parent.project_id}", branch_id: "{parent.id}" }
  roles:
    path: /api/v2/projects/{project_id}/branches/{branch_id}/roles
    params: { project_id: "{parent.project_id}", branch_id: "{parent.id}" }
    strip: ["roles[].password"]
  data_api:
    path: /api/v2/projects/{project_id}/branches/{branch_id}/data-api/{database_name}
    params: { project_id: "{parent.project_id}", branch_id: "{branch_id}", database_name: "{name}" }
    on_status: { 404: empty } # Data API not provisioned for this database

# All Neon projects live in organizations; a personal key lists every org the
# user belongs to, an org or project-scoped key its own org.
accounts:
  endpoint: organizations
  items: organizations
  id: "{id}"
  name: "{name}"
  slug: "{handle}"

kinds:
  - kind: project
    sources:
      - endpoint: projects
        items: projects
        checks_rules: [open_project]
        id: "{id}"
        name: "{name}"
        url: "https://console.neon.tech/app/projects/{id}"
        created_at: { value: "{created_at}", format: rfc3339 }
        attributes:
          - { name: project_id, field: id }
          - region_id
          - pg_version
          - creation_source
          - org_id
    enrich:
      # The list omits settings; GET /projects/{id} has them. Defaults apply
      # only when that call succeeded: "If the list is empty or not set, all
      # IP addresses are allowed" (AllowedIps schema).
      - endpoint: project
        attributes:
          - { name: subscription_type, field: project.owner.subscription_type }
          - { name: allowed_ips, field: project.settings.allowed_ips.ips, default: "" }
          - { name: ip_allow_protected_branches_only, field: project.settings.allowed_ips.protected_branches_only, default: false }
          - { name: block_public_connections, field: project.settings.block_public_connections, default: false }
    match: { value: "{provider_id}" }

  - kind: branch
    for_each: project
    sources:
      - endpoint: branches
        items: branches
        id: "{parent.id}/{id}"
        name: "{name}"
        status: "{current_state|lower}"
        url: "https://console.neon.tech/app/projects/{parent.id}/branches/{id}"
        created_at: { value: "{created_at}", format: rfc3339 }
        attributes:
          - { name: branch_id, field: id }
          - project_id
          - { name: parent_branch_id, field: parent_id }
          - default
          - protected
          - creation_source
          - init_source
          - expires_at
    # Branch ids (br-…) are printed without the project in CLI table output.
    match: { value: "{branch_id}" }

  - kind: endpoint
    for_each: branch
    sources:
      - endpoint: endpoints
        items: endpoints
        checks_rules: [long_running_endpoint]
        id: "{project_id}/{id}"
        name: "{name|or:id}"
        status: "{current_state|lower}"
        created_at: { value: "{created_at}", format: rfc3339 }
        attributes:
          - { name: endpoint_id, field: id }
          - branch_id
          - project_id
          - type
          - current_state
          - last_active
          - suspend_timeout_seconds
          - autoscaling_limit_max_cu
          - disabled
          - creation_source
    match: { value: "{endpoint_id}" }

  - kind: database
    for_each: branch
    sources:
      - endpoint: databases
        items: databases
        checks_rules: [api_exposed_database]
        id: "{parent.project_id}/{branch_id}/{name}"
        name: "{name}"
        created_at: { value: "{created_at}", format: rfc3339 }
        attributes:
          - { name: database_name, field: name }
          - branch_id
          - { name: project_id, template: "{parent.project_id}" }
          - owner_name
    enrich:
      # 404 = no Data API for this database: these become null.
      - endpoint: data_api
        attributes:
          - { name: data_api_url, field: url }
          - { name: data_api_status, field: status }
          - { name: data_api_anon_role, field: settings.db_anon_role }
          - { name: data_api_schemas, field: settings.db_schemas }
    match: { value: "{database_name}", container: "{branch_id}" }

  - kind: role
    for_each: branch
    sources:
      - endpoint: roles
        items: roles
        id: "{parent.project_id}/{branch_id}/{name}"
        name: "{name}"
        created_at: { value: "{created_at}", format: rfc3339 }
        attributes:
          - { name: role_name, field: name }
          - branch_id
          - { name: project_id, template: "{parent.project_id}" }
          - protected
          - authentication_method
    match: { value: "{role_name}", container: "{branch_id}" }

rules:
  - id: api_exposed_database
    kind: database
    severity: high
    signal: api_field
    exposed: { field: data_api_url, is_null: false }
    title: "Data API on: {database_name} ({branch_id}) is reachable over HTTPS"
    explanation: >-
      The Neon API reports a Data API at {data_api_url} (status
      {data_api_status}) for database {database_name} on branch {branch_id},
      exposing schemas {data_api_schemas}. Requests without a token run as
      role {data_api_anon_role}. Neon says the Data API has no permission
      layer of its own: access is decided only by Postgres GRANTs and row
      level security.
    caveat: >-
      The API shows that the Data API is on, not which tables the anonymous or
      authenticated roles can read: GRANTs and RLS are only visible with SQL,
      and Neon's API has no SQL endpoint. Whether the agent passed
      add_default_grants is only visible in its own tool call.

  - id: open_project
    kind: project
    severity: medium
    signal: api_field
    # IP Allow is a Scale plan feature: free and Launch projects cannot set it.
    # Unknown plan (the project call failed): run, so the finding says unknown.
    applies:
      any:
        - { field: subscription_type, present: false }
        - { not: { field: subscription_type, prefix_any: [free, launch, UNKNOWN] } }
    exposed:
      all:
        - { field: allowed_ips, equals: "" }
        - { field: block_public_connections, equals: "false" }
    title: "No IP allow list: {name} accepts connections from any IP"
    explanation: >-
      Project {name} ({subscription_type} plan) has no IP allow list and does
      not block public connections, so the API reports that its computes
      accept Postgres connections from any IP address. A connection still
      needs a role password.
    caveat: >-
      IP Allow is only offered on the Scale plan, so this rule does not run
      for free or Launch projects. Private Networking (VPC endpoints) is not
      checked.

  - id: long_running_endpoint
    kind: endpoint
    severity: low
    signal: api_field
    # Child branches only: the default and protected branches are expected
    # to live long.
    applies:
      all:
        - { field: parent.default, equals: "false" }
        - { field: parent.protected, equals: "false" }
    exposed:
      all:
        - { field: parent.created_at, older_than: 7d }
        - { field: parent.expires_at, present: false }
        - any:
            - { field: current_state, equals: active }
            - { field: suspend_timeout_seconds, equals: "-1" }
    title: "Compute {endpoint_id} still running on week-old branch {parent.name}"
    explanation: >-
      Branch {parent.name} ({branch_id}) was created more than 7 days ago, has
      no expiry, and its compute {endpoint_id} is active now or never scales
      to zero (suspend_timeout_seconds {suspend_timeout_seconds}). It keeps
      using compute hours and is another copy of the parent's data.
    caveat: >-
      current_state is a snapshot: a compute that scales to zero may be idle a
      minute later. The API does not say whether anyone still uses the branch.

signatures:
  # ---- Neon CLI (neon / neonctl). Output from neondatabase/neonctl v2.27.0
  # (src/writer.ts: titled cli-table boxes; --output json|yaml). ----
  - id: neon.cli.projects_create
    kind: project
    role: created
    when: { tool: ^Bash$, command: ['\bneon(?:ctl)?\s+projects?\s+create\b'] }
    extract:
      - from: output # table: title "Project", then Id | Name | Region Id | Created At
        pattern: '(?m)^Project\s*\n[\s\S]*?(?:^|[^a-z0-9-])(?P<id>[a-z]+-[a-z]+-\d{6,10})(?:[^a-z0-9-]|$)'
        value: "{id}"
      - from: output # --output yaml
        pattern: '(?m)^project:\s*\n\s+id:\s*(?P<id>[a-z0-9-]+)\s*$'
        value: "{id}"
      - from: result # --output json: {"project": {...}, "connection_uris": [...]}
        value: "{result.project.id}"

  - id: neon.cli.branches_create
    kind: branch
    role: created
    when: { tool: ^Bash$, command: ['\bneon(?:ctl)?\s+branch(?:es)?\s+create\b'] }
    extract:
      - from: output # table: title "branch", then Name | Id | Current State | Created At | Expires At
        pattern: '(?m)^branch\s*\n[\s\S]*?\b(?P<id>br-[a-z0-9]+(?:-[a-z0-9]+)+)\b'
        value: "{id}"
      - from: output # --output yaml
        pattern: '(?m)^branch:\s*\n\s+id:\s*(?P<id>br-[a-z0-9-]+)\s*$'
        value: "{id}"
      - from: result # --output json: {"branch": {...}, "endpoints": [...], "connection_uris": [...]}
        value: "{result.branch.id}"
        container: "{result.branch.project_id}"
      # The branch's read-write compute (created unless --no-compute).
      - kind: endpoint
        from: output # table: title "endpoints", then Id | Created At
        pattern: '(?m)^endpoints\s*\n[\s\S]*?\b(?P<id>ep-[a-z0-9]+(?:-[a-z0-9]+)+)\b'
        value: "{id}"
      - kind: endpoint
        from: result
        each: result.endpoints
        value: "{item.id}"

  - id: neon.cli.branches_add_compute
    kind: endpoint
    role: created
    when: { tool: ^Bash$, command: ['\bneon(?:ctl)?\s+branch(?:es)?\s+add-compute\b'] }
    extract:
      - from: output # table Id | Host, yaml "id: ep-…", or json "id": "ep-…"
        pattern: '\b(?P<id>ep-[a-z0-9]+(?:-[a-z0-9]+)+)\b'
        value: "{id}"

  - id: neon.cli.databases_create
    kind: database
    role: created
    when: { tool: ^Bash$, command: ['\bneon(?:ctl)?\s+(?:databases?|db)\s+create\b'] }
    extract:
      # The table prints only Name | Owner Name | Created At; the branch is in
      # the command (--branch br-…) or in json/yaml output (branch_id).
      - from: command
        preprocess: shell_args
        pattern: '--name(?:=|\x00)(?P<name>[A-Za-z0-9_.-]+)'
        capture:
          - { from: command, pattern: '--branch[= ](?P<branch>br-[a-z0-9-]+)' }
          - { from: output, pattern: '(?:"branch_id"\s*:\s*"|branch_id:\s*)(?P<obranch>br-[a-z0-9-]+)' }
        value: "{name}"
        container: "{obranch|or:branch}"

  - id: neon.cli.roles_create
    kind: role
    role: created
    when: { tool: ^Bash$, command: ['\bneon(?:ctl)?\s+roles?\s+create\b'] }
    extract:
      - from: command
        preprocess: shell_args
        pattern: '--name(?:=|\x00)(?P<name>[A-Za-z0-9_.-]+)'
        capture:
          - { from: command, pattern: '--branch[= ](?P<branch>br-[a-z0-9-]+)' }
          - { from: output, pattern: '(?:"branch_id"\s*:\s*"|branch_id:\s*)(?P<obranch>br-[a-z0-9-]+)' }
        value: "{name}"
        container: "{obranch|or:branch}"

  # Turning on the Data API creates no database: the database is referenced.
  - id: neon.cli.data_api_create
    kind: database
    role: referenced
    when: { tool: ^Bash$, command: ['\bneon(?:ctl)?\s+data-api\s+create\b'] }
    extract:
      - from: command
        preprocess: shell_args
        pattern: '--database(?:=|\x00)(?P<db>[A-Za-z0-9_.-]+)'
        capture: [{ from: command, pattern: '--branch[= ](?P<branch>br-[a-z0-9-]+)' }]
        value: "{db}"
        container: "{branch}"

  # ---- Neon API through curl (console.neon.tech/api/v2). Errors are
  # GeneralError {code, message, request_id}. ----
  - id: neon.api.create_project
    kind: project
    role: created
    when:
      tool: ^Bash$
      command: ['\bcurl\b', 'console\.neon\.tech/api/v2/projects(?:[?#''"\s]|$)', '(?:-X\s*POST|--request[=\s]+POST|\s-d[\s''"@]|\s--data(?:-raw|-binary)?[=\s]|\s--json[=\s])']
      result_lacks: [code, message]
    extract:
      - { from: result, value: "{result.project.id}" }
      # The project's default branch and its read-write compute.
      - { kind: branch, from: result, value: "{result.branch.id}", container: "{result.project.id}" }
      - { kind: endpoint, from: result, each: result.endpoints, value: "{item.id}" }

  - id: neon.api.create_branch
    kind: branch
    role: created
    when:
      tool: ^Bash$
      command: ['\bcurl\b', 'console\.neon\.tech/api/v2/projects/[a-z0-9-]+/branches(?:[?#''"\s]|$)', '(?:-X\s*POST|--request[=\s]+POST|\s-d[\s''"@]|\s--data(?:-raw|-binary)?[=\s]|\s--json[=\s])']
      result_lacks: [code, message]
    extract:
      - { from: result, value: "{result.branch.id}", container: "{result.branch.project_id}" }
      - { kind: endpoint, from: result, each: result.endpoints, value: "{item.id}" }

  - id: neon.api.create_endpoint
    kind: endpoint
    role: created
    when:
      tool: ^Bash$
      command: ['\bcurl\b', 'console\.neon\.tech/api/v2/projects/[a-z0-9-]+/endpoints(?:[?#''"\s]|$)', '(?:-X\s*POST|--request[=\s]+POST|\s-d[\s''"@]|\s--data(?:-raw|-binary)?[=\s]|\s--json[=\s])']
      result_lacks: [code, message]
    extract:
      - { from: result, value: "{result.endpoint.id}" }

  - id: neon.api.create_database
    kind: database
    role: created
    when:
      tool: ^Bash$
      command: ['\bcurl\b', 'console\.neon\.tech/api/v2/projects/[a-z0-9-]+/branches/br-[a-z0-9-]+/databases(?:[?#''"\s]|$)', '(?:-X\s*POST|--request[=\s]+POST|\s-d[\s''"@]|\s--data(?:-raw|-binary)?[=\s]|\s--json[=\s])']
      result_lacks: [code, message]
    extract:
      - { from: result, value: "{result.database.name}", container: "{result.database.branch_id}" }

  - id: neon.api.create_role
    kind: role
    role: created
    when:
      tool: ^Bash$
      command: ['\bcurl\b', 'console\.neon\.tech/api/v2/projects/[a-z0-9-]+/branches/br-[a-z0-9-]+/roles(?:[?#''"\s]|$)', '(?:-X\s*POST|--request[=\s]+POST|\s-d[\s''"@]|\s--data(?:-raw|-binary)?[=\s]|\s--json[=\s])']
      result_lacks: [code, message]
    extract:
      - { from: result, value: "{result.role.name}", container: "{result.role.branch_id}" }

  - id: neon.api.create_data_api
    kind: database
    role: referenced
    when:
      tool: ^Bash$
      command: ['\bcurl\b', 'console\.neon\.tech/api/v2/projects/[a-z0-9-]+/branches/br-[a-z0-9-]+/data-api/', '(?:-X\s*POST|--request[=\s]+POST|\s-d[\s''"@]|\s--data(?:-raw|-binary)?[=\s]|\s--json[=\s])']
      result_lacks: [code, message]
    extract:
      - from: command
        pattern: 'console\.neon\.tech/api/v2/projects/[a-z0-9-]+/branches/(?P<branch>br-[a-z0-9-]+)/data-api/(?P<db>[A-Za-z0-9_.-]+)'
        value: "{db}"
        container: "{branch}"

  # ---- Stripe Projects (neon/postgres). Ids only if the output prints them. ----
  - id: neon.stripe_projects.add
    kind: project
    role: created
    when: { tool: ^Bash$, command: ['\bstripe\s+projects\s+add\s+neon/'] }
    extract:
      - from: output
        pattern: 'console\.neon\.tech/app/projects/(?P<id>[a-z0-9-]+)'
        value: "{id}"
      - from: output
        pattern: '"project_id"\s*:\s*"(?P<id>[a-z0-9-]+)"'
        value: "{id}"

  # ---- Neon MCP server (github.com/neondatabase/mcp-server-neon). Tool input
  # is {"params": {...}}; results are the API object as JSON text (the
  # project, branch, database, endpoint or role itself), with connection
  # strings and passwords dropped. ----
  - id: neon.mcp.create_project
    kind: project
    role: created
    when: { mcp_tools: [create_project], result_lacks: [error, code], result_has: [id] }
    extract:
      - { from: result, value: "{result.id}" }

  - id: neon.mcp.create_branch
    kind: branch
    role: created
    when: { mcp_tools: [create_branch], result_lacks: [error, code], result_has: [id] }
    extract:
      - { from: result, value: "{result.id}", container: "{result.project_id|or:input.params.project_id}" }

  - id: neon.mcp.create_postgres_endpoint
    kind: endpoint
    role: created
    when: { mcp_tools: [create_postgres_endpoint], result_lacks: [error, code], result_has: [id] }
    extract:
      - { from: result, value: "{result.id}" }

  - id: neon.mcp.create_postgres_database
    kind: database
    role: created
    when: { mcp_tools: [create_postgres_database], result_lacks: [error, code], result_has: [name] }
    extract:
      - { from: result, value: "{result.name}", container: "{result.branch_id|or:input.params.branch_id}" }

  - id: neon.mcp.create_postgres_role
    kind: role
    role: created
    when: { mcp_tools: [create_postgres_role], result_lacks: [error, code], result_has: [name] }
    extract:
      - { from: result, value: "{result.name}", container: "{result.branch_id|or:input.params.branch_id}" }

  - id: neon.mcp.provision_neon_data_api
    kind: database
    role: referenced
    when: { mcp_tools: [provision_neon_data_api], result_lacks: [error, code], result_has: [url] }
    extract:
      - { from: input, value: "{input.params.database_name}", container: "{input.params.branch_id}" }

  # Read-only MCP calls: ids appear, nothing was created.
  - id: neon.mcp.read_projects
    kind: project
    role: referenced
    when: { mcp_tools: [list_projects, describe_project], result_lacks: [error, code] }
    extract:
      - { from: result, each: result.projects, value: "{item.id}" }
      - { from: result, value: "{result.id}" }

  - id: neon.mcp.read_branches
    kind: branch
    role: referenced
    when: { mcp_tools: [list_branches, get_branch, describe_branch], result_lacks: [error, code] }
    extract:
      - { from: result, each: result.branches, value: "{item.id}" }
      - { from: result, value: "{result.id}" }

coverage:
  - { kind: project, status: full, note: "GET /api/v2/projects (cursor), settings from GET /api/v2/projects/{id}; projects in unavailable_project_ids are not listed" }
  - { kind: branch, status: full, note: "GET /api/v2/projects/{id}/branches (cursor)" }
  - { kind: endpoint, status: full, note: "GET /api/v2/projects/{id}/branches/{branch_id}/endpoints" }
  - { kind: database, status: full, note: "GET .../branches/{branch_id}/databases; Data API state per database" }
  - { kind: role, status: full, note: "GET .../branches/{branch_id}/roles; passwords stripped" }
  - { kind: table, status: planned, note: "No SQL endpoint in the Neon API; needs a Postgres connection" }
  - { kind: snapshot, status: planned, note: "GET /api/v2/projects/{id}/snapshots" }
  - { kind: neon_auth, status: planned, note: "GET .../branches/{branch_id}/auth" }
  - { kind: bucket, status: planned, note: "GET .../branches/{branch_id}/buckets" }
  - { kind: function, status: planned, note: "GET .../branches/{branch_id}/functions" }
  - { kind: trigger, status: planned, note: "GET .../branches/{branch_id}/triggers" }
  - { kind: custom_domain, status: planned, note: "GET .../branches/{branch_id}/custom-domains" }
  - { kind: vpc_endpoint, status: planned, note: "GET /api/v2/projects/{id}/vpc_endpoints" }
  - { kind: api_key, status: planned, note: "GET /api/v2/api_keys is metadata only but carries last_used_from_addr (an IP)" }
  - { kind: project_member, status: planned, note: "GET /api/v2/projects/{id}/members" }

recorder:
  pseudonymize: [id, name, handle, org_id, org_name, owner_id, project_id, branch_id, parent_id, host, owner_name, url, database_name]
  keep: [console, neon, vercel, github, active, idle, init, ready, archived, read_write, read_only, scale, launch, free, anonymous, public]
