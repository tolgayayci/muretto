# ---- Neon API through curl ----
- name: curl POST /projects
  tool: Bash
  input: { command: "curl -s -X POST https://console.neon.tech/api/v2/projects -H 'Authorization: Bearer [REDACTED]' -H 'Content-Type: application/json' -d '{\"project\":{\"name\":\"waitlist-demo\"}}'" }
  output: '{"project":{"id":"example-project-123456","name":"waitlist-demo","creation_source":"console","created_at":"2026-09-01T10:00:00Z"},"connection_uris":[{"connection_uri":"[REDACTED]"}],"roles":[{"branch_id":"br-example-000001","name":"neondb_owner","protected":false}],"databases":[{"id":1000001,"branch_id":"br-example-000001","name":"neondb","owner_name":"neondb_owner"}],"operations":[],"branch":{"id":"br-example-000001","project_id":"example-project-123456","name":"main","default":true},"endpoints":[{"id":"ep-example-000001","branch_id":"br-example-000001","type":"read_write"}]}'
  expect:
    - { kind: neon.project, value: example-project-123456, role: created }
    - { kind: neon.branch, value: br-example-000001, container: example-project-123456, role: created }
    - { kind: neon.endpoint, value: ep-example-000001, role: created }
  matches: [neon.project:example-project-123456, neon.branch:example-project-123456/br-example-000001, neon.endpoint:example-project-123456/ep-example-000001]

- name: curl POST /projects that failed (GeneralError)
  tool: Bash
  input: { command: "curl -s -X POST https://console.neon.tech/api/v2/projects -H 'Authorization: Bearer [REDACTED]' -d '{}'" }
  output: '{"request_id":"00000000-0000-4000-8000-000000000001","code":"","message":"projects limit exceeded"}'
  expect: []

- name: curl GET /projects is read-only
  tool: Bash
  input: { command: "curl -s https://console.neon.tech/api/v2/projects?org_id=org-example-12345678 -H 'Authorization: Bearer [REDACTED]'" }
  output: '{"projects":[{"id":"example-project-123456","name":"waitlist-demo"}]}'
  expect: []

- name: curl POST /projects/{id}/branches
  tool: Bash
  input: { command: "curl -s --request POST 'https://console.neon.tech/api/v2/projects/example-project-123456/branches' -H 'Authorization: Bearer [REDACTED]' --json '{\"endpoints\":[{\"type\":\"read_write\"}]}'" }
  output: '{"branch":{"id":"br-example-000002","project_id":"example-project-123456","parent_id":"br-example-000001","name":"br-example-000002","current_state":"init","default":false},"endpoints":[{"id":"ep-example-000002","branch_id":"br-example-000002","type":"read_write"}],"operations":[]}'
  expect:
    - { kind: neon.branch, value: br-example-000002, container: example-project-123456, role: created }
    - { kind: neon.endpoint, value: ep-example-000002, role: created }
  matches: [neon.branch:example-project-123456/br-example-000002, neon.endpoint:example-project-123456/ep-example-000002]

- name: curl POST /projects/{id}/endpoints
  tool: Bash
  input: { command: "curl -s -X POST https://console.neon.tech/api/v2/projects/example-project-123456/endpoints -H 'Authorization: Bearer [REDACTED]' -d '{\"endpoint\":{\"branch_id\":\"br-example-000003\",\"type\":\"read_write\"}}'" }
  output: '{"endpoint":{"host":"ep-example-000003.us-east-2.aws.neon.tech","id":"ep-example-000003","project_id":"example-project-123456","branch_id":"br-example-000003","type":"read_write","current_state":"init"},"operations":[]}'
