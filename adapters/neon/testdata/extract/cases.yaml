- name: CLI branches create (table output, with compute)
  tool: Bash
  input: { command: "neon branches create --name agent-preview --project-id example-project-123456" }
  output: |
    branch
    ┌───────────────┬───────────────────┬───────────────┬──────────────────────┬────────────┐
    │ Name          │ Id                │ Current State │ Created At           │ Expires At │
    ├───────────────┼───────────────────┼───────────────┼──────────────────────┼────────────┤
    │ agent-preview │ br-example-000002 │ init          │ 2026-10-01T10:00:00Z │ never      │
    └───────────────┴───────────────────┴───────────────┴──────────────────────┴────────────┘
    endpoints
    ┌───────────────────┬──────────────────────┐
    │ Id                │ Created At           │
    ├───────────────────┼──────────────────────┤
    │ ep-example-000002 │ 2026-10-01T10:00:00Z │
    └───────────────────┴──────────────────────┘
    connection_uris
    ┌────────────────┐
    │ Connection Uri │
    ├────────────────┤
    │ [REDACTED]     │
    └────────────────┘
  expect:
    - { kind: neon.branch, value: br-example-000002, role: created }
    - { kind: neon.endpoint, value: ep-example-000002, role: created }
  matches: [neon.branch:example-project-123456/br-example-000002, neon.endpoint:example-project-123456/ep-example-000002]

- name: CLI branches create --output json
  tool: Bash
  input: { command: "neonctl branch create --name agent-preview --output json" }
  output: '{"branch":{"id":"br-example-000002","project_id":"example-project-123456","parent_id":"br-example-000001","name":"agent-preview","current_state":"init","creation_source":"neon","default":false},"endpoints":[{"id":"ep-example-000002","branch_id":"br-example-000002","type":"read_write","current_state":"init"}],"connection_uris":[{"connection_uri":"[REDACTED]"}]}'
  expect:
    - { kind: neon.branch, value: br-example-000002, container: example-project-123456, role: created }
    - { kind: neon.endpoint, value: ep-example-000002, role: created }
  matches: [neon.branch:example-project-123456/br-example-000002, neon.endpoint:example-project-123456/ep-example-000002]

