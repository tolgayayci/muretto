# Extract cases built from the CLI, API and MCP output documented in
# adapters/neon/research.md (Creation paths). All ids are fakes. `expect` is the
# exact set of identifiers (kind, value, container, role); [] means none.

# ---- neon / neonctl CLI ----
- name: CLI projects create (table output)
  tool: Bash
  input: { command: "neon projects create --name waitlist-demo --region-id aws-us-east-2" }
  output: |
    Project
    ┌────────────────────────┬───────────────┬───────────────┬──────────────────────┐
    │ Id                     │ Name          │ Region Id     │ Created At           │
    ├────────────────────────┼───────────────┼───────────────┼──────────────────────┤
    │ example-project-123456 │ waitlist-demo │ aws-us-east-2 │ 2026-09-01T10:00:00Z │
    └────────────────────────┴───────────────┴───────────────┴──────────────────────┘
    Connection URIs
    ┌────────────────┐
    │ Connection Uri │
    ├────────────────┤
    │ [REDACTED]     │
    └────────────────┘
  expect:
    - { kind: neon.project, value: example-project-123456, role: created }
  matches: [neon.project:example-project-123456]

- name: CLI projects create (output as printed in the Neon docs)
  tool: Bash
  input: { command: "npx neonctl projects create --name waitlist-demo" }
  output: |
    Project
    ID          example-project-123456
    Name        waitlist-demo
    Region ID   aws-us-east-2
    Created At  2026-09-01T10:00:00Z

    Connection URIs
    Connection URI
    [REDACTED]
  expect:
    - { kind: neon.project, value: example-project-123456, role: created }

- name: CLI projects create --output json
  tool: Bash
  input: { command: "neon projects create --name waitlist-demo --output json" }
  output: '{"project":{"id":"example-project-123456","platform_id":"aws","region_id":"aws-us-east-2","name":"waitlist-demo","creation_source":"neon","created_at":"2026-09-01T10:00:00Z"},"connection_uris":[{"connection_uri":"[REDACTED]"}]}'
  expect:
    - { kind: neon.project, value: example-project-123456, role: created }
  matches: [neon.project:example-project-123456]

- name: CLI projects create --output yaml
  tool: Bash
  input: { command: "neon project create -o yaml" }
  output: |
    project:
      id: example-project-123456
      name: waitlist-demo
      created_at: 2026-09-01T10:00:00Z
    connection_uris:
      - connection_uri: "[REDACTED]"
  expect:
    - { kind: neon.project, value: example-project-123456, role: created }

- name: CLI projects create that failed
  tool: Bash
  status: error
  input: { command: "neon projects create --name waitlist-demo" }
  output: "ERROR: You have reached the limit of 100 projects."
  expect: []

