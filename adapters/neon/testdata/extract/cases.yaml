# ---- Stripe Projects ----
# The add output shape is undocumented; this only checks the id patterns.
- name: Stripe Projects add neon/postgres
  tool: Bash
  input: { command: "stripe projects add neon/postgres --json --no-interactive" }
  output: '{"provider":"neon","service":"postgres","project_id":"example-project-123456","dashboard_url":"https://console.neon.tech/app/projects/example-project-123456"}'
  expect:
    - { kind: neon.project, value: example-project-123456, role: created }
  matches: [neon.project:example-project-123456]

# ---- Neon MCP server ----
- name: MCP create_project
  tool: mcp__neon__create_project
  input: { params: { name: waitlist-demo } }
  output: '{"id":"example-project-123456","name":"waitlist-demo","region_id":"aws-us-east-2","creation_source":"console","created_at":"2026-09-01T10:00:00Z","org_id":"org-example-12345678"}'
  expect:
    - { kind: neon.project, value: example-project-123456, role: created }
  matches: [neon.project:example-project-123456]

- name: MCP create_project error text proves nothing
  tool: mcp__neon__create_project
  input: { params: { name: waitlist-demo } }
  output: "Error: projects limit exceeded"
  expect: []

- name: MCP create_branch (claude.ai connector)
  tool: mcp__claude_ai_Neon__create_branch
  input: { params: { project_id: example-project-123456, name: agent-preview } }
  output: '{"id":"br-example-000002","project_id":"example-project-123456","parent_id":"br-example-000001","name":"agent-preview","current_state":"ready","default":false}'
  expect:
    - { kind: neon.branch, value: br-example-000002, container: example-project-123456, role: created }
  matches: [neon.branch:example-project-123456/br-example-000002]

- name: MCP create_postgres_endpoint
  tool: mcp__neon__create_postgres_endpoint
