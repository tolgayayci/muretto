# Acme Cloud adapter, generated by `muretto adapter new` from acme-3.0.json
# (OpenAPI 3.0.3: Acme Cloud API 2026-10-01). Every endpoint and field below comes from that spec.
# Draft: check every line marked REVIEW, then run `muretto adapter check`.
# Format: docs/WRITING_AN_ADAPTER.md
format: 1
provider: acme-cloud
display_name: Acme Cloud
api:
  base_url: https://api.acme.dev
  auth: {header: Authorization, scheme: Bearer}
token_help: |
  Token for Acme Cloud, sent as a Bearer token in the Authorization header.
  From the API description: An Acme API token from Settings > Tokens.
  Use the narrowest token the API offers (read-only if it has one). Muretto only
  sends GET requests to the endpoints listed in this file, enforced in code (internal/broker).
endpoints:
  # GET /v1/orgs (listOrgs)
  accounts:
    path: /v1/orgs
  # GET /v1/projects (listProjects)
  project:
    path: /v1/projects
    query: {org_id: '{account}', limit: "100"}
    pagination: {next: next_cursor, param: cursor}
  # GET /v1/webhooks (listWebhooks)
  webhook:
    path: /v1/webhooks
    strip: ['items[].secret']
  # GET /v1/projects/{project_id}/databases (listDatabases)
  database:
    path: /v1/projects/{project_id}/databases
    params: {project_id: '{parent.id}'}
    strip: ['[].connection_string', '[].password', 'databases[].connection_string', 'databases[].password']
accounts:
  endpoint: accounts
  items: data
  id: '{id}'
  name: '{name}'
  slug: '{slug}'
kinds:
  - kind: project
    sources:
      - endpoint: project
        items: data
        id: '{id}'
        name: '{name}'
        status: '{status|lower}'
        created_at: {value: '{created_at}', format: rfc3339}
        attributes:
          - region
          - framework
    match: {value: '{provider_id}'}
    remove:
      kind: command
      text: 'curl -X DELETE "https://api.acme.dev/v1/projects/{provider_id}" -H "Authorization: Bearer $ACME_CLOUD_TOKEN"'
      note: 'From the spec (deleteProject): Delete a project and everything in it.'
  - kind: webhook
    sources:
      - endpoint: webhook
        items: items
        id: '{id}'
        url: '{url}'
        attributes:
          - events
    match: {value: '{provider_id}'}
    remove:
      kind: command
      text: 'curl -X DELETE "https://api.acme.dev/v1/webhooks/{provider_id}" -H "Authorization: Bearer $ACME_CLOUD_TOKEN"'
  - kind: database
    for_each: project
    sources:
      - endpoint: database
        items: [databases, $]
        checks_rules: [public_database]
        id: '{parent.provider_id}/{id}'
        name: '{name}'
        created_at: {value: '{created_at}', format: auto}
        attributes:
          - {name: database_id, field: id}
          - engine
          - public
          - {name: settings_ssl_enforced, field: settings.ssl_enforced}
          - {name: settings_ip_allowlist, field: settings.ip_allowlist}
          - {name: project_id, template: '{parent.id}'}
    match: {value: '{database_id}', container: '{project_id}'}
    remove:
      kind: command
      text: 'curl -X DELETE "https://api.acme.dev/v1/projects/{project_id}/databases/{database_id}" -H "Authorization: Bearer $ACME_CLOUD_TOKEN"'
      note: 'From the spec (deleteDatabase): Delete a database.'
rules:
  - # REVIEW: suggested from the database field "public"; check what it means for this API.
    id: public_database
    kind: database
    severity: high
    signal: api_field
    exposed: {field: public, equals: "true"}
    title: 'Public database: {name}'
    explanation: 'Acme Cloud reports public = true for this database, which the API marks as publicly accessible. The API describes the field as: Reachable from the internet without a VPN.'
    caveat: Generated from the OpenAPI field public; what "true" means is the provider's definition.
    fix:
      kind: steps
      text: |-
        Set public to false for this database in Acme Cloud.
        API: PATCH https://api.acme.dev/v1/projects/{project_id}/databases/{database_id} with public set to false in the JSON body.
signatures:
  - # curl POST /v1/projects (createProject) (from the spec)
    id: acme-cloud.api.create_project
    kind: project
    role: created
    when:
      tool: '^Bash$'
      command: ['\bcurl\b', 'api\.acme\.dev/v1/projects(?:[?#''"\s]|$)', '(?:-X\s*POST\b|--request[=\s]+POST\b|\s-d[\s''"@]|\s--data(?:-raw|-binary|-urlencode)?[=\s]|\s--json[=\s])']
      result_lacks: [error]
    extract:
      - from: result
        value: '{result.id}'
  - # curl POST /v1/webhooks (createWebhook) (from the spec)
    id: acme-cloud.api.create_webhook
    kind: webhook
    role: created
    when:
      tool: '^Bash$'
      command: ['\bcurl\b', 'api\.acme\.dev/v1/webhooks(?:[?#''"\s]|$)', '(?:-X\s*POST\b|--request[=\s]+POST\b|\s-d[\s''"@]|\s--data(?:-raw|-binary|-urlencode)?[=\s]|\s--json[=\s])']
      result_lacks: [error]
    extract:
      - from: result
        value: '{result.id}'
  - # curl POST /v1/projects/{project_id}/databases (createDatabase) (from the spec)
    id: acme-cloud.api.create_database
    kind: database
    role: created
    when:
      tool: '^Bash$'
      command: ['\bcurl\b', 'api\.acme\.dev/v1/projects/[^/?#\s''"]+/databases(?:[?#''"\s]|$)', '(?:-X\s*POST\b|--request[=\s]+POST\b|\s-d[\s''"@]|\s--data(?:-raw|-binary|-urlencode)?[=\s]|\s--json[=\s])']
      result_lacks: [error]
    extract:
      - from: result
        value: '{result.database.id}'
        capture:
          - {from: command, pattern: 'api\.acme\.dev/v1/projects/(?P<parent>[^/?#\s''"]+)/databases'}
        container: '{parent}'
coverage:
  - {kind: project, status: full, note: GET /v1/projects}
  - {kind: webhook, status: partial, note: 'GET /v1/webhooks; first page only: pages continue from the last item''s id, which the engine does not support yet'}
  - {kind: database, status: full, note: 'GET /v1/projects/{project_id}/databases'}
  - {kind: log, status: planned, note: 'GET /v1/projects/{project_id}/logs: not generated (looks like events or metrics, not resources)'}
recorder:
  pseudonymize: [id, name, url]
