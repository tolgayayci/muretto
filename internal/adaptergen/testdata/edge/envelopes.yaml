openapi: 3.1.0
info: { title: Edge Cloud, version: "1" }
servers: [{ url: https://api.edge.dev/v1 }]
security: [{ bearer: [] }]
paths:
  /services:
    get:
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    cursor: { type: string }
                    service:
                      type: object
                      required: [id]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        suspended: { type: string, enum: [suspended, not_suspended] }
    post: { responses: { "201": { description: ok } } }
  /zones:
    get:
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 50 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors: { type: array, items: { type: object, properties: { code: { type: integer }, message: { type: string } } } }
                  messages: { type: array, items: { type: object, properties: { code: { type: integer }, message: { type: string } } } }
                  success: { type: boolean }
                  result: { type: array, items: { type: object, required: [id], properties: { id: { type: string }, name: { type: string }, paused: { type: boolean } } } }
                  result_info: { type: object, properties: { page: { type: integer }, per_page: { type: integer }, total_pages: { type: integer } } }
    post: { responses: { "201": { description: ok } } }
components:
  securitySchemes: { bearer: { type: http, scheme: bearer } }
