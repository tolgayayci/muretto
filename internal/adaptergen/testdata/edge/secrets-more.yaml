# Secret values under names the name list does not cover yet.
openapi: 3.1.0
info: { title: Edge Cloud, version: "1" }
servers: [{ url: https://api.edge.dev/v1 }]
security: [{ bearer: [] }]
paths:
  /clusters:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    kubeconfig: { type: string, description: A kubeconfig file with cluster admin credentials. }
                    primary_key: { type: string, description: The storage account access key. }
                    client_key: { type: string, description: PEM-encoded TLS client private key. }
    post: { responses: { "201": { description: ok } } }
components:
  securitySchemes: { bearer: { type: http, scheme: bearer } }
