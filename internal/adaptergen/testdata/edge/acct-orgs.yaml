openapi: 3.1.0
info: { title: Edge Cloud, version: "1" }
servers: [{ url: https://api.edge.dev/v1 }]
security: [{ bearer: [] }]
paths:
  /orgs:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: array, items: { type: object, required: [id], properties: { id: { type: string }, name: { type: string }, slug: { type: string } } } }
  /orgs/{org_id}/projects:
    parameters: [{ name: org_id, in: path, required: true, schema: { type: string } }]
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Project" } }
    post:
      responses:
        "201": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
  /orgs/{org_id}/projects/{project_id}:
    parameters:
      - { name: org_id, in: path, required: true, schema: { type: string } }
      - { name: project_id, in: path, required: true, schema: { type: string } }
    delete: { responses: { "204": { description: gone } } }
components:
  securitySchemes: { bearer: { type: http, scheme: bearer } }
  schemas:
    Project: { type: object, required: [id], properties: { id: { type: string }, name: { type: string } } }
