# {scope} takes two values and has no default: listing only one of them
# silently drops the other half of the items.
openapi: 3.1.0
info: { title: Edge Cloud, version: "1" }
servers: [{ url: https://api.edge.dev/v1 }]
security: [{ bearer: [] }]
paths:
  /catalogs/{scope}/things:
    parameters: [{ name: scope, in: path, required: true, schema: { type: string, enum: [public, private] } }]
    get:
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Thing" } } } } }
    post:
      responses:
        "201": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Thing" } } } }
  /widgets:
    get:
      parameters: [{ name: kind, in: query, required: true, schema: { type: string, enum: [small, large] } }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Thing" } } } } }
    post:
      responses:
        "201": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/Thing" } } } }
components:
  securitySchemes: { bearer: { type: http, scheme: bearer } }
  schemas:
    Thing: { type: object, required: [id], properties: { id: { type: string }, name: { type: string } } }
