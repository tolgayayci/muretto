openapi: 3.1.0
info: { title: Edge Cloud, version: "1" }
servers: [{ url: https://api.edge.dev/v1 }]
security: [{ bearer: [] }]
paths:
  /databases:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        admin_secret: { type: string, writeOnly: true }
                        pin: { type: string, format: password }
                        shared_access: { type: string, x-ms-secret: true }
                        client_secret: { type: string }
                        clientSecret: { type: string }
                        rest_token: { type: string }
                        connection_string: { type: string }
                        apiKey: { type: string }
                        has_password: { type: boolean }
                        token_count: { type: integer }
                        password_protection:
                          type: object
                          properties:
                            enabled: { type: boolean }
                            password: { type: string }
                        access: { type: string, enum: [public, private] }
                        nested:
                          type: object
                          properties:
                            deeper: { type: object, properties: { private_key: { type: string } } }
    post: { responses: { "201": { description: ok } } }
components:
  securitySchemes: { bearer: { type: http, scheme: bearer } }
